<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelFlow</title>
<style>
body{margin:0;padding:16px;background:#111;color:white;font-family:Arial,sans-serif}
input{width:100%;box-sizing:border-box;padding:14px;margin:6px 0;border:none;border-radius:12px;font-size:18px}
button{width:100%;padding:16px;margin:12px 0;border:none;border-radius:14px;background:#22c55e;color:white;font-size:18px;font-weight:700}
.secondary{background:#333}
.header-title{font-size:42px;font-weight:bold;line-height:1.1;margin-bottom:24px}
label{display:block;margin-top:10px;color:#aaa;font-size:14px}
.top-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;align-items:start}
.form-item label{margin:0 0 8px}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.team label{margin:0 0 8px}
.team-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match,.result-card{background:#1f1f1f;padding:16px;border-radius:16px;margin-bottom:16px}
.court{color:#999;margin-bottom:10px;text-transform:uppercase;font-size:13px}
.teams{font-size:18px;font-weight:bold;margin-bottom:14px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{color:#aaa;font-size:15px}
.delta-value{font-weight:700}
.delta-pos{color:#22c55e}
.delta-neg{color:#ef4444}
.delta-zero{color:#ccc}
.tourney-container{background:#1a1a1a;padding:12px;border-radius:12px;margin-bottom:16px}
.tourney-scroll{overflow:auto}
.tourney-table{width:100%;border-collapse:collapse;min-width:900px}
.tourney-table th,.tourney-table td{padding:8px 10px;border-bottom:1px solid #2a2a2a;text-align:center}
.tourney-table th{font-weight:700;color:#ddd;font-size:14px}
.cell-result{display:flex;flex-direction:column;align-items:center}
.cell-result .points{font-weight:700;font-size:16px}
.cell-result .outcome{font-size:13px;margin-top:4px}
.outcome-win{color:#22c55e}
.outcome-draw{color:#9ca3af}
.outcome-loss{color:#ef4444}
.button-row{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.button-row button{flex:1;min-width:200px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;z-index:20;background:#111;padding:8px 0}
.tab-button{flex:1;min-width:120px;padding:12px 16px;border-radius:14px;border:none;background:#222;color:white;font-size:16px;font-weight:700;cursor:pointer}
.tab-button.active{background:#22c55e;color:#111}
.tab-content{display:none}
.tab-content.active{display:block}
.history-card{background:#1f1f1f;border:1px solid #2a2a2a;border-radius:16px;padding:18px;margin-bottom:14px;cursor:pointer;transition:background .2s,border .2s}
.history-card:hover{background:#272727}
.history-card-title{font-size:20px;font-weight:700;margin-bottom:8px}
.history-card-meta{color:#aaa;font-size:14px;margin-bottom:10px}
.history-detail{background:#1f1f1f;border-radius:16px;padding:18px;margin-top:16px}
.player-badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.player-badge{font-size:14px;color:#ddd;display:inline-flex;align-items:center;gap:4px;background:#161616;padding:4px 8px;border-radius:999px;border:1px solid #2a2a2a}
.rating-table{width:100%;border-collapse:collapse;margin-top:12px}
.rating-table th,.rating-table td{padding:10px 12px;border-bottom:1px solid #2a2a2a;text-align:left}
.rating-table th{color:#ddd;font-weight:700;font-size:14px}
@media (max-width:700px){
  body{padding:12px}
  .header-title{font-size:34px}
  .top-grid,.teams-grid,.team-inputs{grid-template-columns:1fr}
  .score{gap:8px}
  input{font-size:16px}
  button{font-size:16px}
}
</style>
</head>
<body>

<div class="header-title" id="appHeader">Командный Американо</div>

<div class="tabs">
  <button class="tab-button active" data-tab="tournament" onclick="switchTab('tournament')">Турнир</button>
  <button class="tab-button" data-tab="history" onclick="switchTab('history')">История</button>
  <button class="tab-button" data-tab="rating" onclick="switchTab('rating')">Рейтинг</button>
</div>

<div id="tab-tournament" class="tab-content active">
<div class="top-grid">
  <div class="form-item">
    <label>Название турнира</label>
    <input id="tournamentName" value="Командный Американо" oninput="updateHeader(); saveData()">
  </div>
  <div class="form-item">
    <label>Дата турнира</label>
    <input id="tournamentDate" value="" oninput="updateHeader(); saveData()">
  </div>
  <div class="form-item">
    <label>Корт 1</label>
    <input id="court1" value="2" oninput="saveData()">
  </div>
  <div class="form-item">
    <label>Корт 2</label>
    <input id="court2" value="6" oninput="saveData()">
  </div>
</div>

<datalist id="playersList"></datalist>

<div class="teams-grid">
  <div class="team">
    <label>Команда 1</label>
    <div class="team-inputs">
      <input id="team1a" value="Михаил" placeholder="Игрок 1" list="playersList" oninput="saveData(); renderTeamInputBadges()">
      <input id="team1b" value="Александр С" placeholder="Игрок 2" list="playersList" oninput="saveData(); renderTeamInputBadges()">
    </div>
    <div class="player-badges" id="team1badges"></div>
  </div>
  <div class="team">
    <label>Команда 2</label>
    <div class="team-inputs">
      <input id="team2a" value="Константин" placeholder="Игрок 1" list="playersList" oninput="saveData(); renderTeamInputBadges()">
      <input id="team2b" value="Виталий" placeholder="Игрок 2" list="playersList" oninput="saveData(); renderTeamInputBadges()">
    </div>
    <div class="player-badges" id="team2badges"></div>
  </div>
  <div class="team">
    <label>Команда 3</label>
    <div class="team-inputs">
      <input id="team3a" value="Никита" placeholder="Игрок 1" list="playersList" oninput="saveData(); renderTeamInputBadges()">
      <input id="team3b" value="Александр Ж" placeholder="Игрок 2" list="playersList" oninput="saveData(); renderTeamInputBadges()">
    </div>
    <div class="player-badges" id="team3badges"></div>
  </div>
  <div class="team">
    <label>Команда 4</label>
    <div class="team-inputs">
      <input id="team4a" value="Сергей" placeholder="Игрок 1" list="playersList" oninput="saveData(); renderTeamInputBadges()">
      <input id="team4b" value="Станислав" placeholder="Игрок 2" list="playersList" oninput="saveData(); renderTeamInputBadges()">
    </div>
    <div class="player-badges" id="team4badges"></div>
  </div>
</div>

<button onclick="generateMatches()">Создать расписание</button>

<div id="matches"></div>

<button onclick="calculateResults()">Посчитать результаты</button>

<div id="results"></div>

<div id="post-results-buttons" class="button-row">
  <button class="secondary" onclick="exportFullReport()">Полная версия</button>
  <button class="secondary" onclick="shareResults()">Поделиться результатом</button>
  <button class="secondary" onclick="saveTournament()">Сохранить турнир</button>
  <button class="secondary" onclick="clearTournament()">Новый турнир / очистить</button>
</div>
</div>

<div id="tab-history" class="tab-content" style="display:none;">
  <div class="button-row" style="margin-bottom:16px;">
    <button class="secondary" onclick="exportHistoryBackup()">Экспорт истории</button>
    <button class="secondary" onclick="triggerHistoryImport()">Импорт истории</button>

  <input id="historyImportInput" type="file" accept="application/json" style="display:none" onchange="importHistoryFile(event)">
  <div id="historyContainer"></div>
  <div id="historyDetail"></div>
</div>

<div id="tab-rating" class="tab-content" style="display:none;">
  <div id="ratingContainer"></div>
</div>

<script>
const rounds = [
  [[0,3,1],[1,2,2]],
  [[0,1,1],[2,3,2]],
  [[0,2,1],[1,3,2]],
  [[3,0,1],[2,1,2]],
  [[1,0,1],[3,2,2]],
  [[2,0,1],[3,1,2]]
];

let lastResultsText = "";
let roundsStats = [];
let lastStats = null;
const defaultPlayers = [
  'Владимиров Никита',
  'Жаткин Александр',
  'Vitaliy M',
  'Курятников Константин',
  'Михаил Авагян',
  'Сотников Александр',
  'Боев Сергей',
  'Гейер Станислав'
];

function getCurrentDate(){
  const now = new Date();
  return `${String(now.getDate()).padStart(2,'0')}.${String(now.getMonth()+1).padStart(2,'0')}.${now.getFullYear()}`;
}

function updateHeader(tab='tournament'){
  const header = document.getElementById('appHeader');
  if(!header) return;
  if(tab === 'history'){
    header.textContent = 'История турниров';
    return;
  }
  if(tab === 'rating'){
    header.textContent = 'Рейтинг игроков';
    return;
  }
  const name = document.getElementById('tournamentName').value || 'Командный Американо';
  const date = document.getElementById('tournamentDate').value || getCurrentDate();
  header.textContent = `${name} • ${date}`;
}

function switchTab(tab){
  document.querySelectorAll('.tab-button').forEach(btn=>btn.classList.toggle('active', btn.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(content=>{
    const show = content.id === `tab-${tab}`;
    content.classList.toggle('active', show);
    content.style.display = show ? 'block' : 'none';
  });
  updateHeader(tab);
  if(tab === 'history') renderHistory();
  if(tab === 'rating') renderRating();
}

function getLocalHistory(){
  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(saved) ? saved : [];
  } catch(e){
    return [];
  }
}

function getHistoryDataSync(){
  const local = getLocalHistory();
  return currentHistory && currentHistory.length ? currentHistory : local;
}

function findHistoryItem(id){
  return getHistoryDataSync().find(item => item.id === id);
}

async function loadTournamentHistory(){
  const localHistory = getLocalHistory();
  if(typeof supabase === 'undefined'){
    currentHistory = localHistory;
    return localHistory;
  }

  try {
    const { data, error } = await supabase.from('tournaments').select('id, created_at, name, date, data').order('created_at', { ascending: false });
    if(error) throw error;

    const cloudHistory = Array.isArray(data) ? data.map(row => {
      const item = row.data || {};
      if(!item.id) item.id = String(row.id || Date.now());
      return {
        ...item,
        name: row.name || item.name || '',
        date: row.date || item.date || '',
        savedAt: item.savedAt || new Date(row.created_at).toISOString()
      };
    }) : [];

    const knownIds = new Set(cloudHistory.map(item => String(item.id)));
    const merged = [...cloudHistory];
    localHistory.forEach(item => {
      if(item.id && !knownIds.has(String(item.id))) merged.unshift(item);
    });
    currentHistory = merged;
    return merged;
  } catch(err){
    currentHistory = localHistory;
    return localHistory;
  }
}

async function saveTournamentToCloud(tournament){
  if(typeof supabase === 'undefined'){
    return { ok: false, error: 'Supabase unavailable' };
  }
  try {
    const { error } = await supabase.from('tournaments').insert([{ name: tournament.name, date: tournament.date, data: tournament }]);
    return error ? { ok: false, error } : { ok: true };
  } catch(err){
    return { ok: false, error: err };
  }
}

async function syncLocalToCloud(){
  const localHistory = getLocalHistory();
  if(typeof supabase === 'undefined' || !navigator.onLine || !localHistory.length){
    return { synced: 0 };
  }

  try {
    const { data, error } = await supabase.from('tournaments').select('data');
    if(error) throw error;
    const remoteIds = new Set((Array.isArray(data) ? data : []).map(row => String(row.data?.id)).filter(Boolean));
    const toSync = localHistory.filter(item => item.id && !remoteIds.has(String(item.id)));
    if(!toSync.length) return { synced: 0 };
    const inserts = toSync.map(item => ({ name: item.name, date: item.date, data: item }));
    const { error: insertError } = await supabase.from('tournaments').insert(inserts);
    if(insertError) throw insertError;
    return { synced: inserts.length };
  } catch(err){
    console.warn('syncLocalToCloud error', err);
    return { synced: 0, error: err };
  }
}

function getRatingStats(){
  const saved = getHistoryDataSync();
  const stats = {};
  saved.forEach(tournament=>{
    const players = tournament.playerStats || [];
    const seen = new Set();
    players.forEach(p=>{
      if(!stats[p.name]) stats[p.name] = {name:p.name, tournaments:0, scored:0, conceded:0, delta:0, wins:0, losses:0, draws:0};
      if(!seen.has(p.name)){
        stats[p.name].tournaments++;
        seen.add(p.name);
      }
      stats[p.name].scored += p.scored;
      stats[p.name].conceded += p.conceded;
      stats[p.name].delta += p.delta;
      stats[p.name].wins += p.wins;
      stats[p.name].losses += p.losses;
      stats[p.name].draws += p.draws;
    });
  });
  const list = Object.values(stats).sort((a,b)=>{
    if(b.delta !== a.delta) return b.delta - a.delta;
    if(b.wins !== a.wins) return b.wins - a.wins;
    if(b.scored !== a.scored) return b.scored - a.scored;
    return a.name.localeCompare(b.name,'ru');
  });
  return list;
}

function buildPlayerMedalMap(){
  const sorted = getRatingStats();
  const medalMap = {};
  let rankGroup = 0;
  let prevKey = null;
  sorted.forEach((player,index)=>{
    const key = `${player.delta}|${player.wins}|${player.scored}|${player.losses}|${player.draws}`;
    if(key !== prevKey){
      rankGroup++;
      prevKey = key;
    }
    const medal = rankGroup === 1 ? '🥇' : rankGroup === 2 ? '🥈' : rankGroup === 3 ? '🥉' : '';
    medalMap[player.name] = medal;
  });
  return medalMap;
}

function getPlayerBadge(name){
  if(!name) return '';
  const medalMap = buildPlayerMedalMap();
  return medalMap[name] || '';
}

function getBadgedPlayer(name){
  const badge = getPlayerBadge(name);
  return badge ? `${badge} ${name}` : name;
}

function getBadgedTeam(team){
  return String(team || '').split(' · ').map(name => getBadgedPlayer(name)).join(' · ');
}

function renderTeamInputBadges(){
  [['team1a','team1b','team1badges'],['team2a','team2b','team2badges'],['team3a','team3b','team3badges'],['team4a','team4b','team4badges']].forEach(([a,b,target])=>{
    const nameA = normalizePlayerName(document.getElementById(a)?.value);
    const nameB = normalizePlayerName(document.getElementById(b)?.value);
    const badges = [nameA,nameB].filter(Boolean).map(name=>{
      const badge = getPlayerBadge(name);
      return badge ? `<span class="player-badge">${badge} ${name}</span>` : `<span class="player-badge">${name}</span>`;
    }).join('');
    const targetEl = document.getElementById(target);
    if(targetEl) targetEl.innerHTML = badges;
  });
}

async function renderHistory(){
  const saved = await loadTournamentHistory();
  const container = document.getElementById('historyContainer');
  const detail = document.getElementById('historyDetail');
  if(!container || !detail) return;
  if(!saved.length){
    container.innerHTML = `<div class="history-detail"><strong>Сохраненных турниров пока нет</strong></div>`;
    detail.innerHTML = '';
    return;
  }
  container.innerHTML = saved.map(item=>{
    const winner = item.finalPlaces?.[0] || '-';
    const second = item.finalPlaces?.[1] || '-';
    const third = item.finalPlaces?.[2] || '-';
    return `<div class="history-card" onclick="showHistoryDetail('${item.id}')"><div class="history-card-title">${item.name}</div><div class="history-card-meta">${item.date}</div><div>Победитель: <strong>${getBadgedPlayer(winner)}</strong></div><div class="small">🥇 ${getBadgedPlayer(winner)} · 🥈 ${getBadgedPlayer(second)} · 🥉 ${getBadgedPlayer(third)}</div></div>`;
  }).join('');
  detail.innerHTML = '';
}

function showHistoryDetail(id){
  const key = 'padelFlowTournamentHistory';
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e){ saved = []; }
  const item = saved.find(t=>t.id === id);
  const detail = document.getElementById('historyDetail');
  if(!item || !detail) return;
  const standings = item.groupStandings.map(s=>`<tr><td>${s.place}</td><td>${getBadgedTeam(s.team)}</td><td>${s.wins}-${s.losses}-${s.draws}</td><td>${s.scored}-${s.conceded}</td><td>${s.delta>0?'+':''}${s.delta}</td></tr>`).join('');
  const playoffLines = item.dayText ? item.dayText.split('\n').filter(line=>line.startsWith('Полуфинал')||line.startsWith('Матч')||line.startsWith('Финал')||line.startsWith('🏆 Плей-офф')).join('<br>') : '';
  detail.innerHTML = `
    <div class="history-detail">
      <div class="history-card-title">${item.name}</div>
      <div class="history-card-meta">${item.date}</div>
      <div style="margin:12px 0;font-weight:700">Итоговые места</div>
      <div class="small">🥇 ${getBadgedPlayer(item.finalPlaces?.[0]||'-')}<br>🥈 ${getBadgedPlayer(item.finalPlaces?.[1]||'-')}<br>🥉 ${getBadgedPlayer(item.finalPlaces?.[2]||'-')}<br>4️⃣ ${getBadgedPlayer(item.finalPlaces?.[3]||'-')}</div>
      <div style="margin:16px 0;font-weight:700">Итоги группового этапа</div>
      <div>${item.groupStandings.map(s=>`<div class="small">${s.place}. ${getBadgedTeam(s.team)} — ${s.wins}-${s.losses}-${s.draws} • ${s.scored}-${s.conceded} • ${s.delta>0?'+':''}${s.delta}</div>`).join('')}</div>
      <div style="margin:16px 0;font-weight:700">Плей-офф</div>
      <div class="small">${item.dayText.split('\n').filter(line=>line.startsWith('Полуфинал')||line.startsWith('Матч')||line.startsWith('Финал')||line.startsWith('🏆 Плей-офф')).join('<br>')}</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;">
        <button class="secondary" onclick="copyHistoryReport('${item.id}')" style="flex:1;min-width:180px">Скопировать отчет</button>
        <button class="secondary" onclick="deleteHistoryTournament('${item.id}')" style="flex:1;min-width:180px;background:#ef4444">Удалить турнир</button>
      </div>
    </div>
  `;
}

function copyHistoryReport(id){
  const item = findHistoryItem(id);
  if(!item) return;
  navigator.clipboard.writeText(item.dayText).then(()=>alert('Готово! Отчет скопирован'));
}

function deleteHistoryTournament(id){
  if(!confirm('Удалить турнир?')) return;
  const localSaved = getLocalHistory();
  const found = localSaved.some(t=>t.id === id);
  if(!found){
    alert('Турнир доступен только из облака и не может быть удален локально.');
    return;
  }
  const filtered = localSaved.filter(t=>t.id !== id);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(filtered));
  currentHistory = currentHistory.filter(t => t.id !== id);
  renderHistory();
  const detail = document.getElementById('historyDetail');
  if(detail) detail.innerHTML = '';
}

function exportHistoryBackup(){
  const key = 'padelFlowTournamentHistory';
  const data = localStorage.getItem(key) || '[]';
  const blob = new Blob([data], {type: 'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'padelflow-backup.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerHistoryImport(){
  const input = document.getElementById('historyImportInput');
  if(input) input.click();
}

function importHistoryFile(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(!confirm('Заменить текущую историю турниров?')){
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const text = e.target.result;
      const parsed = JSON.parse(text);
      if(!Array.isArray(parsed)) throw new Error('Invalid format');
      localStorage.setItem('padelFlowTournamentHistory', JSON.stringify(parsed));
      renderHistory();
      renderRating();
      alert('История успешно восстановлена');
    } catch(err){
      alert('Ошибка импорта файла');
    } finally {
      event.target.value = '';
    }
  };
  reader.onerror = function(){
    alert('Ошибка импорта файла');
    event.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function computeEloRatings(){
  // Placeholder for future ELO-style rating support.
  return getRatingStats();
}

function getPlayerSeriesStats(){
  // Placeholder for future series/streak computations.
  return [];
}

function renderRating(){
  const key = 'padelFlowTournamentHistory';
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e){ saved = []; }
  const container = document.getElementById('ratingContainer');
  if(!container) return;
  if(!saved.length){
    container.innerHTML = `<div class="history-detail"><strong>Рейтинг пока пуст</strong></div>`;
    return;
  }
  const stats = {};
  saved.forEach(tournament=>{
    const players = tournament.playerStats || [];
    const seen = new Set();
    players.forEach(p=>{
      if(!stats[p.name]) stats[p.name] = {name:p.name, tournaments:0, scored:0, conceded:0, delta:0, wins:0, losses:0, draws:0};
      if(!seen.has(p.name)){
        stats[p.name].tournaments++;
        seen.add(p.name);
      }
      stats[p.name].scored += p.scored;
      stats[p.name].conceded += p.conceded;
      stats[p.name].delta += p.delta;
      stats[p.name].wins += p.wins;
      stats[p.name].losses += p.losses;
      stats[p.name].draws += p.draws;
    });
  });
  const list = Object.values(stats).sort((a,b)=>{
    if(b.delta !== a.delta) return b.delta - a.delta;
    if(b.wins !== a.wins) return b.wins - a.wins;
    if(b.scored !== a.scored) return b.scored - a.scored;
    return a.name.localeCompare(b.name,'ru');
  });
  const rows = list.map(p=>{
    const played = p.wins + p.losses + p.draws;
    const rate = played ? Math.round((p.wins/played)*100) : 0;
    const badge = getPlayerBadge(p.name);
    return `<tr><td>${badge ? badge + ' ' : ''}${p.name}</td><td>${p.tournaments}</td><td>${p.scored}-${p.conceded}</td><td>${p.delta>0?'+':''}${p.delta}</td><td>${p.wins}-${p.losses}-${p.draws}</td><td>${rate}%</td></tr>`;
  }).join('');
  container.innerHTML = `<div class="tourney-container"><div class="tourney-scroll"><table class="rating-table"><thead><tr><th>Игрок</th><th>Турниры</th><th>Очки</th><th>Разница</th><th>В-П-Н</th><th>Winrate</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function normalizePlayerName(name){
  return String(name || '').trim().replace(/\s+/g,' ');
}

function getTeams(){
  const formatTeam = (a,b)=>{
    const parts = [normalizePlayerName(a), normalizePlayerName(b)].filter(Boolean);
    return parts.join(' · ');
  };
  return [
    formatTeam(team1a.value, team1b.value),
    formatTeam(team2a.value, team2b.value),
    formatTeam(team3a.value, team3b.value),
    formatTeam(team4a.value, team4b.value)
  ];
}

function getPlayersByIndex(idx){
  const pairs = [
    [team1a.value, team1b.value],
    [team2a.value, team2b.value],
    [team3a.value, team3b.value],
    [team4a.value, team4b.value]
  ];
  return pairs[idx].map(normalizePlayerName).filter(Boolean);
}

function getCourtName(n){
  return n === 1 ? "Корт №" + court1.value : "Корт №" + court2.value;
}

function loadPlayersList(){
  let players = [];
  try { players = JSON.parse(localStorage.getItem('playersList') || '[]'); } catch(e){ players = []; }
  if(!Array.isArray(players) || players.length === 0) players = defaultPlayers.slice();

  const clean = [];
  players.forEach(p=>{
    const name = normalizePlayerName(p);
    if(name && !clean.some(x=>x.toLowerCase()===name.toLowerCase())) clean.push(name);
  });

  localStorage.setItem('playersList', JSON.stringify(clean));
  const list = document.getElementById('playersList');
  list.innerHTML = clean.map(p=>`<option value="${p}">`).join('');
}

function savePlayersFromFields(){
  let players = [];
  try { players = JSON.parse(localStorage.getItem('playersList') || '[]'); } catch(e){ players = []; }
  ['team1a','team1b','team2a','team2b','team3a','team3b','team4a','team4b'].forEach(id=>{
    const el = document.getElementById(id);
    const name = normalizePlayerName(el ? el.value : '');
    if(name && !players.some(p=>String(p).toLowerCase()===name.toLowerCase())) players.push(name);
  });
  localStorage.setItem('playersList', JSON.stringify(players));

}

function autoFill(r,i,side){
  const a = document.getElementById(`a-${r}-${i}`);
  const b = document.getElementById(`b-${r}-${i}`);
  if(!a || !b) return;

  const av = parseInt(a.value);
  const bv = parseInt(b.value);

  if(side === "a" && !isNaN(av) && av >= 0 && av <= 32) b.value = 32 - av;
  if(side === "b" && !isNaN(bv) && bv >= 0 && bv <= 32) a.value = 32 - bv;

  saveData();
}

function autoFillPlayoff(side,id){
  const a = document.getElementById(`playoff-a-${id}`);
  const b = document.getElementById(`playoff-b-${id}`);
  if(!a || !b) return;

  const av = parseInt(a.value);
  const bv = parseInt(b.value);

  if(side === "a" && !isNaN(av) && av >= 0 && av <= 27) b.value = 27 - av;
  if(side === "b" && !isNaN(bv) && bv >= 0 && bv <= 27) a.value = 27 - bv;

  saveData();
  tryRenderFinals();
  tryRenderTournamentTable();
}

function computeGroupStats(){
  const teams = getTeams();
  const stats = {};

  teams.forEach(t=>{
    stats[t] = {
      scored:0,
      conceded:0,
      delta:0,
      wins:0,
      draws:0,
      losses:0,
      rounds:Array(rounds.length).fill(null).map(()=>({scored:'', outcome:''}))
    };
  });

  rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      const aInput = document.getElementById(`a-${r}-${i}`);
      const bInput = document.getElementById(`b-${r}-${i}`);
      if(!aInput || !bInput || aInput.value === "" || bInput.value === "") return;

      const a = Number(aInput.value);
      const b = Number(bInput.value);
      const A = teams[m[0]];
      const B = teams[m[1]];

      stats[A].scored += a;
      stats[A].conceded += b;
      stats[B].scored += b;
      stats[B].conceded += a;

      stats[A].rounds[r].scored = a;
      stats[B].rounds[r].scored = b;

      if(a > b){
        stats[A].wins++;
        stats[B].losses++;
        stats[A].rounds[r].outcome = 'П';
        stats[B].rounds[r].outcome = 'Пр';
      } else if(a < b){
        stats[B].wins++;
        stats[A].losses++;
        stats[B].rounds[r].outcome = 'П';
        stats[A].rounds[r].outcome = 'Пр';
      } else {
        stats[A].draws++;
        stats[B].draws++;
        stats[A].rounds[r].outcome = 'Н';
        stats[B].rounds[r].outcome = 'Н';
      }
    });
  });

  Object.keys(stats).forEach(t=>stats[t].delta = stats[t].scored - stats[t].conceded);

  const sorted = Object.entries(stats).sort((a,b)=>{
    if(b[1].delta !== a[1].delta) return b[1].delta - a[1].delta;
    if(b[1].scored !== a[1].scored) return b[1].scored - a[1].scored;
    return b[1].wins - a[1].wins;
  });

  return {teams, stats, sorted};
}

function allGroupRoundsFilled(){
  let filled = true;
  rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      const a = document.getElementById(`a-${r}-${i}`);
      const b = document.getElementById(`b-${r}-${i}`);
      if(!a || !b || a.value === "" || b.value === "") filled = false;
    });
  });
  return filled;
}

function deltaClass(delta){
  if(delta > 0) return 'delta-pos';
  if(delta < 0) return 'delta-neg';
  return 'delta-zero';
}

function getPlayoffFinalists(){
  if(!roundsStats || roundsStats.length < 4) return null;
  const sf1a = document.getElementById('playoff-a-sf1');
  const sf1b = document.getElementById('playoff-b-sf1');
  const sf2a = document.getElementById('playoff-a-sf2');
  const sf2b = document.getElementById('playoff-b-sf2');
  if(!sf1a || !sf1b || !sf2a || !sf2b) return null;
  if(sf1a.value === "" || sf1b.value === "" || sf2a.value === "" || sf2b.value === "") return null;

  const place1 = roundsStats[0];
  const place2 = roundsStats[1];
  const place3 = roundsStats[2];
  const place4 = roundsStats[3];

  const sf1Winner = Number(sf1a.value) > Number(sf1b.value) ? place1 : place4;
  const sf1Loser = sf1Winner === place1 ? place4 : place1;
  const sf2Winner = Number(sf2a.value) > Number(sf2b.value) ? place2 : place3;
  const sf2Loser = sf2Winner === place2 ? place3 : place2;

  return {sf1Winner, sf1Loser, sf2Winner, sf2Loser};
}

function playoffsCompleted(){

  return ids.every(id=>{

    return el && el.value !== "";
  });
}

function getFinalPlaces(){
  const finalData = getPlayoffFinalists();
  if(!finalData) return [];
  const fa = document.getElementById('playoff-a-final');
  const fb = document.getElementById('playoff-b-final');
  const ta = document.getElementById('playoff-a-3rd');
  const tb = document.getElementById('playoff-b-3rd');
  if(!fa || !fb || !ta || !tb || fa.value === "" || fb.value === "" || ta.value === "" || tb.value === "") return [];

  const finalWinner = Number(fa.value) > Number(fb.value) ? finalData.sf1Winner : finalData.sf2Winner;
  const finalLoser = finalWinner === finalData.sf1Winner ? finalData.sf2Winner : finalData.sf1Winner;
  const thirdWinner = Number(ta.value) > Number(tb.value) ? finalData.sf1Loser : finalData.sf2Loser;
  const fourth = thirdWinner === finalData.sf1Loser ? finalData.sf2Loser : finalData.sf1Loser;

  return [finalWinner, finalLoser, thirdWinner, fourth];
}

function tryRenderTournamentTable(){
  if(!playoffsCompleted() || !lastStats) return;
  const container = document.getElementById('tournament-table');
  if(!container) return;

  const data = lastStats;
  const sorted = data.sorted;
  const medals = ["🥇","🥈","🥉","4️⃣"];
  const finalPlaces = getFinalPlaces();

  let html = `<h2 style="text-align:center;margin-top:18px;">📋 Таблица турнира</h2>`;
  html += `<div class="tourney-container"><div class="tourney-scroll"><table class="tourney-table"><thead><tr>`;
  html += `<th>Место</th><th>Команда</th>`;
  for(let r=0;r<rounds.length;r++) html += `<th>Р${r+1}</th>`;
  html += `<th>ПФ</th><th>Ф/3М</th><th>Очки</th><th>Разница</th><th>В-П-Н</th>`;
  html += `</tr></thead><tbody>`;

  finalPlaces.forEach((team,index)=>{
    const s = data.stats[team];
    html += `<tr>`;
    html += `<td style="font-weight:700">${medals[index]} ${index+1}</td>`;
    html += `<td style="text-align:left;padding-left:12px"><strong>${team}</strong></td>`;

    for(let r=0;r<rounds.length;r++){
      const pr = s.rounds[r];
      if(pr && pr.scored !== ''){
        const cls = pr.outcome === 'П' ? 'outcome-win' : (pr.outcome === 'Н' ? 'outcome-draw' : 'outcome-loss');
        html += `<td><div class="cell-result"><div class="points">${pr.scored}</div><div class="outcome ${cls}">${pr.outcome}</div></div></td>`;
      } else {
        html += `<td>-</td>`;
      }

    html += `<td>${getPlayoffScoreForTeam(team,'semi')}</td>`;
    html += `<td>${getPlayoffScoreForTeam(team,'final')}</td>`;

    html += `<td><span class="delta-value ${deltaClass(s.delta)}">${s.delta>0?'+':''}${s.delta}</span></td>`;
    html += `<td>${s.wins}-${s.losses}-${s.draws}</td>`;
    html += `</tr>`;
  });

  html += `</tbody></table></div></div>`;
  
  container.innerHTML = html;
  lastResultsText = buildDayText();
  saveData();
}

function getPlayoffScoreForTeam(team,type){
  if(!roundsStats || roundsStats.length < 4) return '-';
  const finalData = getPlayoffFinalists();
  const sf1a = document.getElementById('playoff-a-sf1');
  const sf1b = document.getElementById('playoff-b-sf1');
  const sf2a = document.getElementById('playoff-a-sf2');
  const sf2b = document.getElementById('playoff-b-sf2');
  const fa = document.getElementById('playoff-a-final');
  const fb = document.getElementById('playoff-b-final');
  const ta = document.getElementById('playoff-a-3rd');
  const tb = document.getElementById('playoff-b-3rd');

  if(type === 'semi'){
    if(team === roundsStats[0] || team === roundsStats[3]) return `${sf1a?.value || ''}-${sf1b?.value || ''}`;
    if(team === roundsStats[1] || team === roundsStats[2]) return `${sf2a?.value || ''}-${sf2b?.value || ''}`;
    return '-';
  }

  if(!finalData) return '-';
  if(team === finalData.sf1Winner || team === finalData.sf2Winner) return `${fa?.value || ''}-${fb?.value || ''}`;
  if(team === finalData.sf1Loser || team === finalData.sf2Loser) return `${ta?.value || ''}-${tb?.value || ''}`;
  return '-';
}

    round.forEach((m,i)=>{

  });

function buildCompactShareText(){
  const data = computeGroupStats();
  const name = tournamentName.value || 'Командный Американо';
  const date = tournamentDate.value || getCurrentDate();
  let text = `🎾 ${name} • ${date}\n\n`;
  text += `🏆 Итоги группового этапа\n\n`;

  const medals = ["🥇","🥈","🥉","4️⃣"];
  data.sorted.forEach((item,index)=>{
    const team = item[0];
    const s = item[1];
    const delta = s.delta === 0 ? '±0' : (s.delta > 0 ? `+${s.delta}` : `${s.delta}`);
    text += `${medals[index]} ${team}\n`;
    text += `${s.wins}-${s.losses}-${s.draws} • ${delta} • ${s.scored}:${s.conceded}\n\n`;
  });

  const playoffFinalists = getPlayoffFinalists();
  if(playoffFinalists){
    const sf1a = document.getElementById('playoff-a-sf1');
    const sf1b = document.getElementById('playoff-b-sf1');
    const sf2a = document.getElementById('playoff-a-sf2');
    const sf2b = document.getElementById('playoff-b-sf2');
    text += `🏆 Плей-офф\n\n`;
    text += `Полуфиналы\n`;
    text += `${getBadgedTeam(roundsStats[0])} ${sf1a.value}:${sf1b.value} ${getBadgedTeam(roundsStats[3])}\n`;
    text += `${getBadgedTeam(roundsStats[1])} ${sf2a.value}:${sf2b.value} ${getBadgedTeam(roundsStats[2])}\n\n`;

    const ta = document.getElementById('playoff-a-3rd');
    const tb = document.getElementById('playoff-b-3rd');
    if(ta && tb && ta.value !== '' && tb.value !== ''){
      text += `Матч за 3 место\n`;
      text += `${getBadgedPlayer(playoffFinalists.sf1Loser)} ${ta.value}:${tb.value} ${getBadgedPlayer(playoffFinalists.sf2Loser)}\n\n`;
    }

    const fa = document.getElementById('playoff-a-final');
    const fb = document.getElementById('playoff-b-final');
    if(fa && fb && fa.value !== '' && fb.value !== ''){
      text += `Финал\n`;
      text += `${getBadgedPlayer(playoffFinalists.sf1Winner)} ${fa.value}:${fb.value} ${getBadgedPlayer(playoffFinalists.sf2Winner)}\n\n`;
    }

    const finalPlaces = getFinalPlaces();
    if(finalPlaces.length === 4){
      text += `🏅 Итог турнира\n\n`;
      text += `🥇 ${finalPlaces[0]}\n`;
      text += `🥈 ${finalPlaces[1]}\n`;
      text += `🥉 ${finalPlaces[2]}\n`;
      text += `4️⃣ ${finalPlaces[3]}\n`;
    }
  }

  return text;
}

  const text = buildCompactShareText();

  }
}

function getPersonalStats(){
  const playerStats = {};
  function ensure(name){
    if(!playerStats[name]) playerStats[name] = {name, scored:0, conceded:0, delta:0, wins:0, losses:0, draws:0};
    return playerStats[name];
  }

  rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      const aEl = document.getElementById(`a-${r}-${i}`);
      const bEl = document.getElementById(`b-${r}-${i}`);
      if(!aEl || !bEl || aEl.value === "" || bEl.value === "") return;
      const a = Number(aEl.value);
      const b = Number(bEl.value);

      const playersA = getPlayersByIndex(m[0]);
      const playersB = getPlayersByIndex(m[1]);

      playersA.forEach(p=>{
        const s = ensure(p);
        s.scored += a; s.conceded += b;
        if(a > b) s.wins++; else if(a < b) s.losses++; else s.draws++;
      });
      playersB.forEach(p=>{
        const s = ensure(p);
        s.scored += b; s.conceded += a;
        if(b > a) s.wins++; else if(b < a) s.losses++; else s.draws++;
      });
    });
  });

  Object.values(playerStats).forEach(s=>s.delta = s.scored - s.conceded);
  return Object.values(playerStats).sort((a,b)=>{
    if(b.delta !== a.delta) return b.delta - a.delta;
    if(b.scored !== a.scored) return b.scored - a.scored;
    return b.wins - a.wins;
  });
}

function buildTournamentHistoryEntry(){
  const groupData = computeGroupStats();
  return {
    id:String(Date.now()),
    name:tournamentName.value || 'Командный Американо',
    date:tournamentDate.value || getCurrentDate(),
    savedAt:new Date().toISOString(),
    teams:getTeams(),
    groupText:buildGroupStageText(),
    dayText:buildDayText(),
    groupStandings:groupData.sorted.map((item,index)=>({
      place:index+1,
      team:item[0],
      ...item[1]
    })),
    finalPlaces:getFinalPlaces(),
    playerStats:getPersonalStats()
  };
}

async function saveTournament(){
  savePlayersFromFields();
  const entry = buildTournamentHistoryEntry();
  const saved = getLocalHistory();
  saved.push(entry);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(saved));
  currentHistory = [entry, ...currentHistory.filter(item => item.id !== entry.id)];

  const cloudResult = await saveTournamentToCloud(entry);
  if(cloudResult.ok){
    alert('Готово! Турнир сохранен локально и в облако');
  } else {
    console.warn('Supabase save failed', cloudResult.error);
    alert('Турнир сохранен локально. Облачная синхронизация будет выполнена позднее.');
  }
}

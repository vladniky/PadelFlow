<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelFlow</title>
<style>
body{margin:0;padding:16px;background:#06214a;color:white;font-family:'Inter',system-ui,sans-serif;font-weight:500}
input,select,textarea,button{font-family:'Inter',system-ui,sans-serif}
input,select,textarea{width:100%;box-sizing:border-box;padding:14px;margin:6px 0;border:none;border-radius:12px;font-size:18px;font-weight:500}
button{width:100%;padding:16px;margin:12px 0;border:none;border-radius:14px;background:#d0ff41;color:#0a1b33;font-size:18px;font-weight:700}
.secondary{background:#d0ff41;color:#0a1b33}
.danger{background:#ff6a5a!important;color:#06214a!important}



label{display:block;margin-top:10px;color:#c6d0dd;font-size:14px}
.settings-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;align-items:start}
.settings-grid input,
.settings-grid select{padding:12px!important;margin:4px 0!important;font-size:16px!important;height:48px}
.settings-grid label{font-size:13px}
.courts-grid{display:grid;gap:12px;margin-bottom:16px;align-items:start}
.courts-grid.courts-1{grid-template-columns:1fr}
.courts-grid.courts-2{grid-template-columns:repeat(2,1fr)}
.courts-grid.courts-3{grid-template-columns:repeat(3,1fr)}
.courts-grid input{padding:12px!important;margin:4px 0!important;font-size:16px!important;height:48px}
.courts-grid label{font-size:13px}
.form-item label{margin:0 0 8px}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.team label{margin:0 0 8px}
.team-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match,.result-card{background:#0a2a57;padding:16px;border-radius:16px;margin-bottom:16px}
.court{color:#93a5be;margin-bottom:10px;text-transform:uppercase;font-size:13px}
.teams{font-size:18px;font-weight:bold;margin-bottom:14px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{color:#c6d0dd;font-size:15px}
.resting{color:#7f8da3;font-size:14px;text-align:center;margin:-6px 0 18px}
.delta-value{font-weight:700}
.delta-pos{color:#d0ff41}
.delta-neg{color:#ff6a5a}
.delta-zero{color:#c6d0dd}
.tourney-container{background:#08254f;padding:12px;border-radius:12px;margin-bottom:16px}
.tourney-scroll{overflow:auto}
.tourney-table{width:100%;border-collapse:collapse;min-width:900px}
.tourney-table th,.tourney-table td{padding:8px 10px;border-bottom:1px solid #14407f;text-align:center;font-weight:500}
.tourney-table th{color:#dce4ef;font-size:14px}
.cell-result{display:flex;flex-direction:column;align-items:center}
.cell-result .points{font-weight:700;font-size:16px}
.cell-result .outcome{font-size:13px;margin-top:4px}
.outcome-win{color:#d0ff41}
.outcome-draw{color:#5c6b80}
.outcome-loss{color:#ff6a5a}
.button-row{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.button-row button{flex:1;min-width:200px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;z-index:20;background:#06214a;padding:8px 0}
.tab-button{flex:1;min-width:120px;padding:12px 16px;border-radius:14px;border:none;background:#0b2f63;color:white;font-size:16px;font-weight:700;cursor:pointer}
.tab-button.active{background:#d0ff41;color:#0a1b33;box-shadow:0 0 0 1px rgba(208,255,65,.75),0 0 18px rgba(208,255,65,.25)}
.tab-content{display:none}
.tab-content.active{display:block}
button:disabled{opacity:.45;cursor:not-allowed;}
.error-border{box-shadow:0 0 0 2px rgba(255,106,90,0.9) inset; border-radius:12px}
.draft-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.draft-modal{background:#06214a;border:1px solid #14407f;border-radius:18px;padding:24px;max-width:420px;width:100%;box-shadow:0 18px 60px rgba(0,0,0,.65)}
.draft-modal-title{font-size:24px;font-weight:800;margin-bottom:12px}
.draft-modal-text{color:#c6d0dd;margin-bottom:20px;line-height:1.5}
.draft-modal-actions{display:flex;gap:12px;flex-wrap:wrap}
.draft-modal-actions button{flex:1}
.history-card{background:#0a2a57;border:1px solid #14407f;border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer;transition:background .2s,border .2s}
.history-card:hover{background:#113a76}
.history-card-open{border-color:#d0ff41;box-shadow:0 0 0 1px rgba(208,255,65,.45)}
.history-card-title{font-size:22px;font-weight:800;margin-bottom:6px;line-height:1.1;color:#fff}
.history-card-meta{color:rgba(255,255,255,.78);font-size:15px;margin:0}
.history-detail{background:#0a2a57;border-radius:16px;padding:18px;margin-top:16px}


.home-screen{background:#06214a;border:1px solid #14407f;border-radius:20px;padding:26px 24px;margin-bottom:18px}
.home-screen h1{font-size:48px;font-weight:800;line-height:1.05;margin:0 0 12px}

.home-screen .home-actions{display:grid;gap:12px}
.home-screen .home-actions button{font-size:18px}
@media (max-width:700px){.home-screen{padding:20px}.home-screen h1{font-size:36px}}





input:focus{outline:2px solid rgba(208,255,65,.7);box-shadow:0 0 0 4px rgba(208,255,65,.12)}
@media (min-width:701px) and (max-width:980px){
  .settings-grid{grid-template-columns:repeat(2,1fr)}
  .courts-grid.courts-1{grid-template-columns:1fr}
  .courts-grid.courts-2{grid-template-columns:repeat(2,1fr)}
  .courts-grid.courts-3{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:700px){
  body{padding:12px}
  
  
  
  .settings-grid{grid-template-columns:1fr}
  .courts-grid{grid-template-columns:1fr!important}
  .teams-grid,.team-inputs{grid-template-columns:1fr}
  .score{gap:8px}
  input{font-size:16px}
  button{font-size:16px}
  .match .teams{
    font-size:13px;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
}

/* Premium application interface */
:root{
  --ink:#0a1b33;
  --ground:#eef2f8;
  --paper:rgba(255,255,255,.72);
  --surface:rgba(255,255,255,.86);
  --surface-2:#dce4ef;
  --panel:#06214a;
  --panel-2:#0b2f63;
  --lime:#d0ff41;
  --lime-deep:#0250b0;
  --chalk:#f4f8ff;
  --muted:#5c6b80;
  --muted-dark:#c6d0dd;
  --line:rgba(2,45,100,.1);
  --line-dark:rgba(255,255,255,.12);
  --coral:#ff6a5a;
  /* Палитра проекта */
  --elite-blue:#0250b0;
  --volt-lime:#d0ff41;
  --silver-cloud:#c6d0dd;
  /* Поле корта на главной. Чтобы получить синий вариант как на постере,
     достаточно поменять только эти три значения. */
  --court-field:linear-gradient(160deg,#0250b0 0%,#023a82 100%);
  --court-line:rgba(255,255,255,.46);
  --court-net:rgba(255,255,255,.78);
  --shadow:0 18px 55px rgba(6,30,70,.09),0 2px 8px rgba(6,30,70,.04);
  --display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
  --mono:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--ground)}
body{
  min-height:100vh;
  margin:0;
  padding:0;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 82% 4%,rgba(2,80,176,.09),transparent 23rem),
    var(--ground);
  color:var(--ink);
  font-family:var(--body);
  font-weight:600;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(2,45,100,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(2,45,100,.025) 1px,transparent 1px);background-size:32px 32px}
button,input,select,textarea{font-family:var(--body)}
button,input,select,textarea{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--lime-deep);outline-offset:3px}
button{cursor:pointer}
[hidden]{display:none!important}
button:disabled{cursor:not-allowed;filter:saturate(.35)}
.app-shell{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr);position:relative}
.app-sidebar{position:sticky;top:0;height:100vh;z-index:30;display:flex;flex-direction:column;padding:28px 22px;background:var(--panel);color:var(--chalk);border-right:1px solid rgba(255,255,255,.04)}
.brand-button{width:100%;margin:0;padding:0;border:0;border-radius:0;background:transparent;color:var(--chalk);display:flex;align-items:center;gap:12px;text-align:left;box-shadow:none}
.brand-button:hover{transform:none;background:transparent}
.brand-mark{width:44px;height:44px;flex:0 0 44px;border:1px solid rgba(208,255,65,.55);border-radius:50%;display:grid;place-items:center;position:relative;color:var(--lime);font:800 18px/1 var(--display);letter-spacing:-.04em}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;inset:6px;border:1px solid rgba(208,255,65,.22);border-radius:50%}
.brand-mark:after{inset:13px -2px;transform:rotate(-28deg);border-left-color:transparent;border-right-color:transparent}
.brand-word{font:800 27px/1 var(--display);text-transform:uppercase;letter-spacing:.035em}.brand-word span{color:var(--lime)}
.sidebar-session{margin-top:34px;padding:14px;border:1px solid var(--line-dark);border-radius:4px;background:rgba(255,255,255,.035)}
.sidebar-kicker{color:var(--lime);font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase}
.sidebar-title{margin-top:7px;font-size:13px;font-weight:800}.sidebar-meta{margin-top:4px;color:var(--muted-dark);font-size:11px;line-height:1.45}
.sidebar-nav{display:grid;gap:4px;margin-top:30px}
.sidebar-nav button{width:100%;min-height:48px;margin:0;padding:0 14px;border:0;border-left:2px solid transparent;border-radius:0;background:transparent;color:var(--muted-dark);box-shadow:none;display:flex;align-items:center;gap:12px;text-align:left;font-size:13px;font-weight:800}
.sidebar-nav button:hover,.sidebar-nav button.active{transform:none;color:var(--chalk);border-color:var(--lime);background:linear-gradient(90deg,rgba(208,255,65,.12),transparent)}
.nav-index{width:22px;color:var(--lime);font:600 11px/1 var(--mono)}
.sidebar-foot{margin-top:auto;display:flex;align-items:center;gap:9px;padding:12px 4px 0;color:var(--muted-dark);font-size:11px}
.sidebar-foot:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 4px rgba(208,255,65,.1)}
.app-main{min-width:0;padding:32px clamp(24px,4vw,62px) 64px}






.home-screen{position:relative;isolation:isolate;overflow:hidden;min-height:min(620px,calc(100vh - 150px));margin:0;padding:clamp(32px,7vw,88px);border:0;border-radius:8px;background:var(--court-field);color:var(--chalk);box-shadow:var(--shadow);display:flex!important;flex-direction:column;align-items:center;justify-content:center;gap:clamp(26px,5vh,52px);text-align:center}
.home-court{flex:0 0 auto;height:clamp(150px,29vh,300px);width:auto;pointer-events:none}
.court-lines{stroke:var(--court-line);stroke-width:1.2}
.court-net{stroke:var(--court-net);stroke-width:2.4}
.home-screen[style*="display: none"],.home-screen[style*="display:none"]{display:none!important}


.home-intro{position:relative;z-index:1;max-width:720px;width:100%}
.home-screen h1{margin:0;color:var(--chalk);font:800 clamp(60px,10vw,122px)/.78 var(--display);letter-spacing:-.035em;text-transform:uppercase;text-wrap:balance}

.home-screen .home-actions{max-width:460px;margin:clamp(20px,3.2vh,30px) auto 0;grid-template-columns:1fr;gap:10px}
.home-screen .home-actions button{margin:0;min-width:0}
.tabs{top:0;margin:0 0 24px;padding:8px;background:rgba(240,244,250,.92);border:1px solid var(--line);border-radius:6px;backdrop-filter:blur(14px)}
.tab-button{min-width:120px;min-height:44px;margin:0;padding:10px 16px;border:0;border-radius:3px;background:transparent;color:var(--muted);box-shadow:none;font:800 12px/1 var(--body);text-transform:uppercase;letter-spacing:.055em}
.tab-button:hover{transform:none;background:var(--surface-2);color:var(--ink)}
.tab-button.active{background:var(--panel);color:var(--chalk);box-shadow:none}
.tab-content{animation:courtline-enter .28s ease both}@keyframes courtline-enter{from{opacity:.4;transform:translateY(7px)}to{opacity:1;transform:none}}
#goHomeBar{margin:0 0 14px!important}#goHomeBar button{width:auto;margin:0;padding:10px 14px;background:transparent;color:var(--muted);border:1px solid var(--line)}
#draftBar{min-height:46px;margin:0 0 18px!important;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
#draftBar:before{content:"LIVE";color:var(--lime-deep);font:600 9px/1 var(--mono);letter-spacing:.1em}
#draftStatus,#storageNote{font:600 10px/1.35 var(--mono)!important;color:var(--muted)!important}
#saveDraftNowBtn{margin:0 0 0 auto!important;border:1px solid var(--line)!important;background:var(--surface-2)!important;color:var(--ink)!important}
.settings-grid,.courts-grid,.teams-grid{gap:12px;margin-bottom:18px;padding:25px;border:1px solid var(--line);border-radius:8px;background:var(--surface);position:relative}
.settings-grid{grid-template-columns:repeat(3,minmax(0,1fr));padding-top:58px}.settings-grid:before{content:"01  ·  Параметры турнира";position:absolute;left:25px;top:25px;color:var(--ink);font:700 23px/1 var(--display);text-transform:uppercase}.settings-grid:after{content:"Настройка";position:absolute;right:25px;top:28px;color:var(--lime-deep);font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.courts-grid{padding-top:58px}.courts-grid:before{content:"02  ·  Корты";position:absolute;left:25px;top:25px;color:var(--ink);font:700 23px/1 var(--display);text-transform:uppercase}
.teams-grid{padding-top:58px}.teams-grid:before{content:"03  ·  Участники";position:absolute;left:25px;top:25px;color:var(--ink);font:700 23px/1 var(--display);text-transform:uppercase}
.form-item label,.team>label{margin:0 0 8px;color:var(--muted);font:600 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
input,select,textarea{width:100%;height:49px;margin:0;padding:0 14px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;transition:border-color .15s,box-shadow .15s,background .15s}
textarea{height:auto;padding-block:12px}
input:hover,select:hover,textarea:hover{border-color:#93a5be}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--lime-deep);background:var(--surface);box-shadow:0 0 0 3px rgba(2,80,176,.12)}
input::placeholder,textarea::placeholder{color:#8496ae;font-weight:600}select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.team-inputs{gap:8px}
button{min-height:50px;margin:12px 0;padding:0 22px;border:0;border-radius:2px;background:var(--lime);color:#0a1b33;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.055em;box-shadow:none;transition:transform .15s,filter .15s,background .15s}
button:hover{filter:brightness(1.03);transform:translateY(-1px)}button:active{transform:translateY(0)}
.secondary{background:var(--panel);color:var(--chalk)}.danger{background:transparent!important;color:var(--coral)!important;border:1px solid rgba(255,106,90,.55)!important}
#startTournamentBtn{margin:2px 0 0;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));font-size:13px}
.round-section{margin-top:28px}

.round-matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.round-matches .resting{grid-column:1/-1}
.match,.result-card{position:relative;overflow:hidden;margin:0;padding:22px;border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:none}
.match:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lime-deep)}
.match .court{margin:0 0 12px;color:var(--lime-deep);font:600 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}.match .teams{min-height:44px;margin:0 0 16px;color:var(--ink);font:700 clamp(19px,2vw,25px)/1.05 var(--display);text-transform:uppercase;text-wrap:balance}
.score{position:relative;grid-template-columns:1fr 1fr;gap:9px}.score:after{content:":";position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);color:var(--lime-deep);font:600 14px/1 var(--mono);pointer-events:none}.score input{height:64px;padding:0 12px;background:var(--panel);border-color:var(--line-dark);color:var(--chalk);font:600 28px/1 var(--mono);text-align:center;font-variant-numeric:tabular-nums}.score input{caret-color:transparent}
.score input:focus{border-color:var(--lime);background:#0a2a57;box-shadow:0 0 0 3px rgba(208,255,65,.30)}
.resting{margin:0;padding:12px;border:1px dashed var(--line);color:var(--muted);font:600 10px/1.45 var(--mono);text-transform:uppercase}
.button-row{gap:10px;margin:16px 0}.button-row button{min-width:0;margin:0;white-space:normal;padding-inline:16px}
#calculateStatus,#startStatus{color:var(--coral);font:600 10px/1.4 var(--mono)}
#results>h2,#playoff-section>h2,#playoff-finals>h3,#tournament-table>h2{margin:34px 0 16px!important;color:var(--ink);font:700 clamp(30px,4vw,46px)/.95 var(--display);text-align:left!important;text-transform:uppercase}

.tourney-container{margin:0 0 18px;padding:0;border:1px solid var(--line);border-radius:7px;background:var(--surface);overflow:hidden}.tourney-scroll{overflow-x:auto}.tourney-table{min-width:660px}.tourney-table th,.tourney-table td{padding:16px 18px;border-bottom:1px solid var(--line);color:var(--ink);font:600 11px/1.3 var(--mono);font-variant-numeric:tabular-nums}.tourney-table th{color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}.tourney-table td:nth-child(2){font-family:var(--body)}.tourney-table tbody tr:first-child{background:linear-gradient(90deg,rgba(2,80,176,.10),transparent 70%)}
.ranking-note{margin:-8px 0 18px;color:var(--muted);font-size:12px}
.delta-pos{color:var(--lime-deep)}.delta-neg{color:var(--coral)}.delta-zero{color:var(--muted)}
.history-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;margin:0 0 10px;padding:21px 58px 21px 22px;border:1px solid var(--line);border-radius:3px;background:var(--surface);transition:transform .16s,border-color .16s}.history-card:after{content:"→";position:absolute;right:22px;color:var(--lime-deep);font:600 18px/1 var(--mono)}.history-card:hover{transform:translateY(-2px);border-color:var(--lime-deep);background:var(--surface)}.history-card-open{border-color:var(--lime-deep);box-shadow:inset 3px 0 var(--lime-deep)}
.history-card-title{margin:0;color:var(--ink);font:700 26px/1 var(--display);text-transform:uppercase}.history-card-meta{margin-top:7px;color:var(--muted);font:600 10px/1.5 var(--mono);text-transform:uppercase}
.history-detail{margin:-11px 0 16px;padding:24px;border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;background:var(--surface-2);line-height:1.6}.history-detail>.history-card-title{font-size:35px}.history-detail .small{padding:5px 0;color:var(--muted);font-size:12px;border-bottom:1px solid rgba(92,107,128,.12)}
.draft-modal-overlay{background:rgba(2,12,30,.72);backdrop-filter:blur(9px)}.draft-modal{max-width:480px;padding:30px;border:1px solid var(--line-dark);border-radius:7px;background:var(--panel);color:var(--chalk);box-shadow:0 28px 90px rgba(0,0,0,.45)}.draft-modal-title{font:700 34px/1 var(--display);text-transform:uppercase}.draft-modal-text{color:var(--muted-dark);font-size:13px}.draft-modal-actions button{min-width:150px}

.mobile-nav{display:none}
.error-border{border-color:var(--coral)!important;box-shadow:0 0 0 3px rgba(255,106,90,.12)!important}
input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
input[type="date"]::-webkit-date-and-time-value{margin:0;text-align:left;line-height:normal}
input[type="date"]::-webkit-datetime-edit{padding:0;line-height:normal;overflow:hidden}
input[type="date"]::-webkit-calendar-picker-indicator{margin:0;opacity:.55}
@media(max-width:1050px){.app-shell{grid-template-columns:84px minmax(0,1fr)}.app-sidebar{padding:24px 14px}.brand-word,.sidebar-session,.sidebar-nav button span:last-child,.sidebar-foot span{display:none}.brand-button,.sidebar-nav button,.sidebar-foot{justify-content:center}.sidebar-nav button{padding:0}.nav-index{width:auto}.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
  body{padding:0}.app-shell{display:block;max-width:100%}.app-sidebar{display:none}.app-main{width:100%;max-width:100%;padding:20px 16px calc(96px + env(safe-area-inset-bottom))}

<link rel="manifest" href="manifest.json">

<body>
<div class="app-shell">
<aside class="app-sidebar" aria-label="Основная навигация">
  <button class="brand-button" type="button" onclick="showHomeScreen()" aria-label="PadelFlow — на главную">
    <span class="brand-mark">PF</span>
    <span class="brand-word">Padel<span>Flow</span></span>
  </button>
  <div class="sidebar-session">
    <div class="sidebar-kicker">PadelFlow</div>
    <div class="sidebar-title">Игровой день</div>
    <div class="sidebar-meta">Расписание, счёт и история всегда под рукой</div>
  </div>
  <nav class="sidebar-nav">
    <button type="button" data-side-tab="tournament" onclick="switchTab('tournament')"><span class="nav-index">01</span><span>Турнир</span></button>
    <button type="button" data-side-tab="history" onclick="switchTab('history')"><span class="nav-index">02</span><span>История</span></button>
    <button type="button" data-side-home onclick="showHomeScreen()"><span class="nav-index">03</span><span>Главная</span></button>
  </nav>
  <div class="sidebar-foot"><span>Офлайн-режим готов</span></div>
</aside>
<main class="app-main">
<div id="homeScreen" class="home-screen" style="display:none;">
  <!-- Настоящая разметка падел-корта: поле 10x20 м, линия подачи в 6,95 м от сетки,
       центральная линия делит только зоны подачи. Теннисных коридоров тут нет. -->
  <svg class="home-court" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
    <g class="court-lines" fill="none" vector-effect="non-scaling-stroke">
      <rect x="0.5" y="0.5" width="99" height="199"/>
      <line x1="0.5" y1="30.5" x2="99.5" y2="30.5"/>
      <line x1="0.5" y1="169.5" x2="99.5" y2="169.5"/>
      <line x1="50" y1="30.5" x2="50" y2="169.5"/>
    </g>
    <line class="court-net" x1="0.5" y1="100" x2="99.5" y2="100" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="home-intro">
    <h1>PadelFlow</h1>
    <div class="home-actions">
      <button onclick="startNewTournamentFromHome()">Начать турнир</button>
      <button id="continueDraftHomeBtn" class="secondary" onclick="continueDraftFromHome()" style="display:none">Продолжить турнир</button>
    </div>
  </div>
</div>

<div id="draftBar" style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
  <div id="draftStatus" class="small">Черновик не сохранен</div>
  <div id="storageNote" class="small">Хранится на этом устройстве</div>
  <button id="saveDraftNowBtn" class="secondary" style="width:auto;padding:8px 12px;font-size:14px;">Сохранить сейчас</button>
</div>
<div id="draftModalOverlay" class="draft-modal-overlay">
  <div class="draft-modal">
    <div class="draft-modal-title">Найден незавершенный турнир</div>
    <div class="draft-modal-text">В localStorage найден черновик турнира. Продолжите его или начните новый.</div>
    <div class="draft-modal-actions">
      <button onclick="continueDraft()">Продолжить турнир</button>
      <button class="secondary" onclick="discardDraftAndStartNew()">Начать новый</button>
    </div>
  </div>
</div>

<div id="tab-tournament" class="tab-content active">
<div class="settings-grid">
  <div class="form-item">
    <label>Формат турнира</label>
    <select id="tournamentFormat" onchange="onFormatChange(); saveData()">
      <option value="" selected disabled>Выберите формат</option>
      <option value="pairs">Парный — фиксированные пары</option>
      <option value="individual">Индивидуальный — каждый сам за себя</option>
    </select>
  </div>
  <div class="form-item">
    <label>Название турнира</label>
    <input id="tournamentName" value="" placeholder="Американо" oninput="updateHeader(); saveData()">
  </div>
  <div class="form-item">
    <label>Дата турнира</label>
    <input id="tournamentDate" type="date" value="" oninput="updateHeader(); saveData()">
  </div>
  <div class="form-item" id="pairCountField" style="display:none;">
    <label>Количество пар</label>
    <select id="pairCount" onchange="onPairCountChange(); saveData()">
      <option value="" selected disabled>Выберите количество пар</option>
      <option value="2">2 пары / 4 игрока</option>
      <option value="3">3 пары / 6 игроков</option>
      <option value="4">4 пары / 8 игроков</option>
      <option value="5">5 пар / 10 игроков</option>
      <option value="6">6 пар / 12 игроков</option>
    </select>
  </div>
  <div class="form-item" id="playerCountField" style="display:none;">
    <label>Количество игроков</label>
    <select id="playerCount" onchange="onPlayerCountChange(); saveData()">
      <option value="" selected disabled>Выберите количество игроков</option>
      <option value="4">4 игрока</option>
      <option value="8">8 игроков</option>
      <option value="12">12 игроков</option>
    </select>
  </div>
  <div class="form-item" id="roundCountField" style="display:none;">
    <label>Количество кругов</label>
    <select id="roundCount" onchange="saveData()">
      <option value="" selected disabled>Выберите количество кругов</option>
      <option value="1">1 круг</option>
      <option value="2">2 круга</option>
      <option value="3">3 круга</option>
    </select>
  </div>
  <div class="form-item" id="individualCircleCountField" style="display:none;">
    <label>Количество кругов</label>
    <select id="individualCircleCount" onchange="onIndividualCircleChange(); saveData()">
      <option value="" selected disabled>Выберите количество кругов</option>
      <option value="1">1 круг</option>
      <option value="2">2 круга</option>
      <option value="3">3 круга</option>
    </select>
  </div>
  <div class="form-item">
    <label>Играем до</label>
    <select id="roundLimit" onchange="onRoundLimitChange(); saveData()">
      <option value="" selected disabled>Выберите лимит</option>
      <option value="21">21</option>
      <option value="24">24</option>
      <option value="27">27</option>
      <option value="32">32</option>
      <option value="custom">Свой</option>
    </select>
    <input id="roundLimitCustom" type="number" min="1" placeholder="Свое число" value="32" style="display:none;margin-top:6px;" oninput="saveData()">
  </div>
  <div class="form-item">
    <label>Места определяются</label>
    <select id="rankingMode" onchange="onRankingModeChange(); saveData()">
      <option value="delta" selected>По разнице очков</option>
      <option value="wins">По количеству побед</option>
    </select>
  </div>
  <div class="form-item">
    <label>Количество кортов</label>
    <select id="courtCount" onchange="onCourtCountChange(); saveData()">
      <option value="" selected disabled>Выберите количество кортов</option>
      <option value="1">1 корт</option>
      <option value="2">2 корта</option>
      <option value="3">3 корта</option>
    </select>
  </div>
</div>

<div class="courts-grid courts-2" id="courtsGrid">
  <div class="form-item" id="courtField1">
    <label>Корт 1</label>
    <input id="court1" value="" placeholder="2" oninput="saveData()">
  </div>
  <div class="form-item" id="courtField2">
    <label>Корт 2</label>
    <input id="court2" value="" placeholder="6" oninput="saveData()">
  </div>
  <div class="form-item" id="courtField3" style="display:none;">
    <label>Корт 3</label>
    <input id="court3" value="" placeholder="8" oninput="saveData()">
  </div>
</div>


<div class="teams-grid">
  <div class="team" id="team1">
    <label>Пара 1</label>
    <div class="team-inputs">
      <input id="team1a" value="" placeholder="Игрок 1" oninput="saveData()">
      <input id="team1b" value="" placeholder="Игрок 2" oninput="saveData()">
    </div>
  </div>
  <div class="team" id="team2">
    <label>Пара 2</label>
    <div class="team-inputs">
      <input id="team2a" value="" placeholder="Игрок 1" oninput="saveData()">
      <input id="team2b" value="" placeholder="Игрок 2" oninput="saveData()">
    </div>
  </div>
  <div class="team" id="team3">
    <label>Пара 3</label>
    <div class="team-inputs">
      <input id="team3a" value="" placeholder="Игрок 1" oninput="saveData()">
      <input id="team3b" value="" placeholder="Игрок 2" oninput="saveData()">
    </div>
  </div>
  <div class="team" id="team4">
    <label>Пара 4</label>
    <div class="team-inputs">
      <input id="team4a" value="" placeholder="Игрок 1" oninput="saveData()">
      <input id="team4b" value="" placeholder="Игрок 2" oninput="saveData()">
    </div>
  </div>
  <div class="team" id="team5" style="display:none;">
    <label>Пара 5</label>
    <div class="team-inputs">
      <input id="team5a" value="" placeholder="Игрок 1" oninput="saveData()">
      <input id="team5b" value="" placeholder="Игрок 2" oninput="saveData()">
    </div>
  </div>
  <div class="team" id="team6" style="display:none;">
    <label>Пара 6</label>
    <div class="team-inputs">
      <input id="team6a" value="" placeholder="Игрок 1" oninput="saveData()">
      <input id="team6b" value="" placeholder="Игрок 2" oninput="saveData()">
    </div>
  </div>
</div>

<button id="startTournamentBtn" onclick="startTournament()">Начать турнир</button>
<div style="display:flex;gap:8px;align-items:center;">
  <div id="startStatus" class="small" style="margin-top:4px;">Заполните всех игроков</div>
</div>

<div id="matches"></div>

<div id="results"></div>

<div id="post-results-buttons" class="button-row" hidden>
  <button onclick="saveTournament()">Завершить турнир</button>
  <button class="secondary" onclick="shareResults()">Поделиться результатом</button>
</div>
</div>

<div id="tab-history" class="tab-content" style="display:none;">
  <div id="historyContainer"></div>
  <div id="historyDetail"></div>
</div>
<nav class="mobile-nav" aria-label="Мобильная навигация">
  <button type="button" onclick="switchTab('tournament')">Турнир</button>
  <button type="button" onclick="showHomeScreen()">Главная</button>
  <button type="button" onclick="switchTab('history')">История</button>
</nav>
</main>
</div>

<script>
// История живёт только в этом браузере: localStorage, без внешних сервисов.
const HISTORY_KEY = 'padelFlowTournamentHistory';
const DRAFT_KEY = 'padelFlowCurrentDraft';
const LEGACY_DRAFT_KEY = 'padelAmericanoData';
let currentHistory = [];
let openedHistoryId = null;
let tournamentStarted = false;
let playoffStarted = false;
let autoHistorySaveTimer = null;
let finalizingTournament = false;


const roundTemplates = [
  [[0,3,1],[1,2,2]],
  [[0,1,1],[2,3,2]],
  [[0,2,1],[1,3,2]],
  [[3,0,1],[2,1,2]],
  [[1,0,1],[3,2,2]],
  [[2,0,1],[3,1,2]]
];

let rounds = [];

const DEFAULT_PAIR_COUNT = 4;
const DEFAULT_COURT_COUNT = 2;
const DEFAULT_ROUND_LIMIT = 32;
const ROUND_LIMIT_OPTIONS = [21,24,27,32];
const PLAYOFF_LIMIT_OPTIONS = [15,21,24,27,32];

const INDIVIDUAL_PLAYER_OPTIONS = [4,8,12];
const INDIVIDUAL_CIRCLE_OPTIONS = [1,2,3];

function getTournamentFormat(){
  const value = document.getElementById('tournamentFormat')?.value || '';
  return (value === 'individual' || value === 'pairs') ? value : '';
}

function isIndividual(){
  return getTournamentFormat() === 'individual';
}

function getPlayerCount(){
  const value = parseInt(document.getElementById('playerCount')?.value || '', 10);
  return INDIVIDUAL_PLAYER_OPTIONS.includes(value) ? value : 0;
}

function getIndividualCircleCount(){
  const value = parseInt(document.getElementById('individualCircleCount')?.value || '', 10);
  return INDIVIDUAL_CIRCLE_OPTIONS.includes(value) ? value : 0;
}

// Круг = каждый сыграл в паре с каждым ровно раз, то есть (игроков - 1) игр на человека.
function getIndividualCircleGames(playerCount, circles){
  const players = Number(playerCount) || 0;
  if(!players) return 0;
  return (players - 1) * (Number(circles) || 1);
}

// Сколько раундов-слотов нужно, чтобы закрыть выбранные круги на доступных кортах.
function getIndividualRoundTotal(){
  const players = getPlayerCount();
  const courts = getCourtCount();
  const circles = getIndividualCircleCount();
  if(!players || !courts || !circles) return 0;
  const needed = Math.ceil(getIndividualCircleGames(players, circles) * players / (courts * 4));
  const table = INDIVIDUAL_ROTATIONS[players]?.[courts];
  return table ? Math.min(needed, table.length) : 0;
}

function pluralGames(count){
  const n = Math.abs(Number(count) || 0);
  const tail = n % 10, hundred = n % 100;
  if(tail === 1 && hundred !== 11) return 'игра';
  if(tail >= 2 && tail <= 4 && (hundred < 12 || hundred > 14)) return 'игры';
  return 'игр';
}

// Подписи вида "1 круг · 7 игр" — сколько игр даст круг, видно до старта.
function updateIndividualCircleOptions(){
  const select = document.getElementById('individualCircleCount');
  if(!select) return;
  const players = getPlayerCount();
  Array.from(select.options).forEach(option=>{
    const circles = parseInt(option.value, 10);
    if(!INDIVIDUAL_CIRCLE_OPTIONS.includes(circles)) return;
    const word = circles === 1 ? 'круг' : 'круга';
    if(!players){
      option.textContent = `${circles} ${word}`;
      return;
    }
    const games = getIndividualCircleGames(players, circles);
    option.textContent = `${circles} ${word} · ${games} ${pluralGames(games)}`;
  });
}

// Сколько блоков полей с именами показывать: пара = блок, в индивидуальном — двое игроков в блоке.
function getNameBlockCount(){
  return isIndividual() ? getPlayerCount() / 2 : getPairCount();
}

// Итоговое число раундов независимо от формата — им пользуются история и отчёт.
function getEffectiveRoundCount(){
  return isIndividual() ? getIndividualRoundTotal() : getRoundCount();
}

// Больше матчей одновременно, чем кортов, быть не может: 8 игроков на 3 кортах не играют.
function getMaxCourtsForFormat(){
  if(!isIndividual()) return 3;
  const players = getPlayerCount();
  return players ? players / 4 : 3;
}

function buildIndividualRounds(playerCount, roundCount, courtCount){
  const safeCourts = [1,2,3].includes(Number(courtCount)) ? Number(courtCount) : 0;
  const table = INDIVIDUAL_ROTATIONS[playerCount]?.[safeCourts];
  if(!table || !roundCount || !safeCourts) return [];
  const total = Math.min(Number(roundCount), table.length);
  const result = [];
  for(let r = 0; r < total; r++){
    result.push(table[r].map((match, matchIndex)=>[
      match[0].slice(),
      match[1].slice(),
      matchIndex + 1
    ]));
  }
  return result;
}

// Кто не выходит на корт в этом раунде.
function getRestingPlayers(round){
  if(!isIndividual() || !round) return [];
  const names = getTeams();
  const onCourt = new Set();
  round.forEach(m=>{
    if(Array.isArray(m[0])) m[0].forEach(i=>onCourt.add(i));
    if(Array.isArray(m[1])) m[1].forEach(i=>onCourt.add(i));
  });
  return names.filter((_, i)=>!onCourt.has(i));
}

// Сколько матчей достанется каждому при текущих настройках.
function getIndividualPlan(){
  if(!isIndividual()) return null;
  const players = getPlayerCount();
  const courts = getCourtCount();
  const roundCount = getIndividualRoundTotal();
  if(!players || !courts || !roundCount) return null;
  const list = buildIndividualRounds(players, roundCount, courts);
  if(!list.length) return null;
  const played = new Array(players).fill(0);
  list.forEach(round=>round.forEach(m=>{
    [...(m[0]||[]), ...(m[1]||[])].forEach(i=>{ played[i] = (played[i] || 0) + 1; });
  }));
  return {
    rounds: list.length,
    resting: players - courts * 4,
    minMatches: Math.min(...played),
    maxMatches: Math.max(...played)
  };
}

// Сторона матча: в парном это индекс пары, в индивидуальном — пара индексов игроков.
function getMatchSideLabel(side){
  const names = getTeams();
  if(Array.isArray(side)){
    return side.map(i => names[i]).filter(Boolean).join(' · ') || 'Игроки';
  }
  return names[side] || 'Пара';
}

function getMatchSideMembers(side){
  const names = getTeams();
  if(Array.isArray(side)) return side.map(i => names[i]).filter(Boolean);
  return names[side] ? [names[side]] : [];
}

function getMatchSidePlayers(side){
  if(Array.isArray(side)){
    const names = getTeams();
    return side.map(i => names[i]).filter(Boolean);
  }
  return getPlayersByIndex(side);
}

  const el = document.getElementById('pairCount');
  const value = parseInt(el?.value || '', 10);
  return [2,3,4,5,6].includes(value) ? value : 0;
}

function getCourtCount(){
  const el = document.getElementById('courtCount');
  const value = parseInt(el?.value || '', 10);
  return [1,2,3].includes(value) ? value : 0;
}

function getRoundLimitMode(){
  const el = document.getElementById('roundLimit');
  return el?.value || String(DEFAULT_ROUND_LIMIT);
}

function getRoundLimit(){
  const mode = getRoundLimitMode();
  if(!mode) return 0;
  if(mode === 'custom'){
    const custom = document.getElementById('roundLimitCustom');
    const customValue = parseInt(custom?.value || '', 10);
    return customValue > 0 ? customValue : 0;
  }
  const value = parseInt(mode, 10);
  return ROUND_LIMIT_OPTIONS.includes(value) ? value : 0;
}


function getPlayoffLimitMode(){
  const el = document.getElementById('playoffLimit');
  if(el && el.value) return el.value;
  // Селект еще не отрисован (восстановление черновика/истории) — берем значение из снапшота.
  return pendingPlayoffLimitMode || '27';
}

function getPlayoffLimit(){
  const mode = getPlayoffLimitMode();
  if(mode === 'custom'){
    const custom = document.getElementById('playoffLimitCustom');
    const customValue = parseInt((custom && custom.value) || pendingPlayoffLimitCustom || '', 10);
    return customValue > 0 ? customValue : 27;
  }
  const value = parseInt(mode, 10);
  return PLAYOFF_LIMIT_OPTIONS.includes(value) ? value : 27;
}

function onPlayoffLimitChange(){
  const mode = getPlayoffLimitMode();
  const customInput = document.getElementById('playoffLimitCustom');
  if(customInput){
    customInput.style.display = mode === 'custom' ? 'block' : 'none';
    if(mode !== 'custom' && !customInput.value){
      customInput.value = '27';
    }
  }
  saveData();
}

// Порядок мест. Первый критерий задаёт пользователь, остальные — постоянные,
// чтобы одинаковые показатели не расставлялись случайно.
function compareStandings(a, b){
  if(getRankingMode() === 'wins'){
    if(b.wins !== a.wins) return b.wins - a.wins;
    if(b.delta !== a.delta) return b.delta - a.delta;
    return b.scored - a.scored;
  }
  if(b.delta !== a.delta) return b.delta - a.delta;
  if(b.scored !== a.scored) return b.scored - a.scored;
  return b.wins - a.wins;
}

function getRoundCount(){
  const el = document.getElementById('roundCount');
  const value = parseInt(el?.value || '', 10);
  return [1,2,3].includes(value) ? value : 0;
}

function buildRoundRobinRounds(pairCount, courtCount){
  const hasBye = pairCount % 2 === 1;
  const bye = -1;
  let items = Array.from({length: pairCount}, (_, i) => i);
  if(hasBye) items.push(bye);

  const n = items.length;
  const roundsList = [];
  for(let r = 0; r < n - 1; r++){
    const matches = [];
    for(let i = 0; i < n / 2; i++){
      const a = items[i];
      const b = items[n - 1 - i];
      if(a !== bye && b !== bye){
        matches.push([a, b, (matches.length % courtCount) + 1]);
      }
    }
    roundsList.push(matches);
    items = [items[0], items[n - 1], ...items.slice(1, n - 1)];
  }
  return roundsList;
}

function buildRoundsByCount(pairCount, roundCount, courtCount){
  const safePairCount = [2,3,4,5,6].includes(Number(pairCount)) ? Number(pairCount) : 0;
  const safeRoundCount = [1,2,3].includes(Number(roundCount)) ? Number(roundCount) : 0;
  const safeCourtCount = [1,2,3].includes(Number(courtCount)) ? Number(courtCount) : 0;

  if(!safePairCount || !safeRoundCount || !safeCourtCount) return [];

  const baseRounds = buildRoundRobinRounds(safePairCount, safeCourtCount);
  const result = [];
  for(let circle = 0; circle < safeRoundCount; circle++){
    baseRounds.forEach((round, roundIndex)=>{
      result.push(round.map((match, matchIndex)=>[
        match[0],
        match[1],
        ((circle * baseRounds.length + roundIndex + matchIndex) % safeCourtCount) + 1
      ]));
    });
  }
  return result;
}

function refreshRounds(){
  rounds = isIndividual()

function parseHistoryDateValue(value){
  const raw = String(value || '').trim();
  if(!raw) return 0;

  if(/^\d{4}-\d{2}-\d{2}/.test(raw)){
    const time = new Date(raw).getTime();
    return Number.isNaN(time) ? 0 : time;
  }

  const match = raw.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(match){
    const time = new Date(`${match[3]}-${match[2]}-${match[1]}T00:00:00`).getTime();
    return Number.isNaN(time) ? 0 : time;
  }

  const fallback = new Date(raw).getTime();
  return Number.isNaN(fallback) ? 0 : fallback;
}

function getHistorySortTime(item){
  return parseHistoryDateValue(item?.date) || parseHistoryDateValue(item?.savedAt) || parseHistoryDateValue(item?._createdAt) || 0;
}

// Сверху самый свежий турнир. При одинаковой дате решает время сохранения.
function sortHistoryNewestFirst(list){
  return [...list].sort((a,b)=>{
    const timeA = getHistorySortTime(a);
    const timeB = getHistorySortTime(b);
    if(timeA !== timeB) return timeB - timeA;
    const savedA = parseHistoryDateValue(a?.savedAt);
    const savedB = parseHistoryDateValue(b?.savedAt);
    if(savedA !== savedB) return savedB - savedA;
    return String(b?.name || '').localeCompare(String(a?.name || ''), 'ru');
  });
}

function isHistoryFinished(item){
  if(item?.status === 'completed') return true;
  const rounds = getRoundsForHistory(item);

  return rounds.every((round, r)=>round.every((m, i)=>
    scores[`a-${r}-${i}`] !== '' && scores[`a-${r}-${i}`] !== undefined &&
    scores[`b-${r}-${i}`] !== '' && scores[`b-${r}-${i}`] !== undefined
  ));
}

}

function getRoundsForHistory(item){
  if(getHistoryFormat(item) === 'individual'){
    const playerRaw = Number(item?.playerCount || item?.editData?.playerCount || 8);
    const playerCount = INDIVIDUAL_PLAYER_OPTIONS.includes(playerRaw) ? playerRaw : 8;
    const roundRaw = Number(item?.roundCount || 7);
    const courtRaw = Number(item?.courtCount || item?.editData?.courtCount || 2);
    const courtCount = [1,2,3].includes(courtRaw) ? courtRaw : 2;
    return buildIndividualRounds(playerCount, roundRaw, courtCount);
  }
  const pairRaw = Number(item?.pairCount || item?.editData?.pairCount || 4);
  const roundRaw = Number(item?.roundCount || item?.editData?.roundCount || 2);
  const courtRaw = Number(item?.courtCount || item?.editData?.courtCount || 2);
  const pairCount = [2,3,4,5,6].includes(pairRaw) ? pairRaw : 4;
  const roundCount = [1,2,3].includes(roundRaw) ? roundRaw : 2;
  const courtCount = [1,2,3].includes(courtRaw) ? courtRaw : 2;
  return buildRoundsByCount(pairCount, roundCount, courtCount);
}

function getHistoryTeams(item){
  if(getHistoryFormat(item) === 'individual'){
    if(Array.isArray(item?.teams) && item.teams.length >= 2) return item.teams;
    const playerRaw = Number(item?.playerCount || item?.editData?.playerCount || 8);
    const playerCount = INDIVIDUAL_PLAYER_OPTIONS.includes(playerRaw) ? playerRaw : 8;
    const data = item?.editData || {};
    return Array.from({length: playerCount}, (_, i)=>{
      const block = Math.floor(i / 2) + 1;
      const side = i % 2 === 0 ? 'a' : 'b';
      return stripPlayerBadge(data[`team${block}${side}`] || '') || `Игрок ${i + 1}`;
    });
  }
  const rawPairCount = Number(item?.pairCount || item?.editData?.pairCount || 4);
  const pairCount = [2,3,4,5,6].includes(rawPairCount) ? rawPairCount : 4;
  if(Array.isArray(item?.teams) && item.teams.length >= 2){
    return item.teams.slice(0, Math.min(item.teams.length, pairCount));
  }
  const data = item?.editData || {};
  const formatTeam = (a,b, index)=>{
    const parts = [stripPlayerBadge(a || ''), stripPlayerBadge(b || '')].filter(Boolean);
    return parts.length ? parts.join(' · ') : `Пара ${index}`;
  };
  return Array.from({length: pairCount}, (_, i)=>formatTeam(data[`team${i+1}a`], data[`team${i+1}b`], i+1));
}

function buildHistoryMatchesHtml(item){
  const roundsForItem = getRoundsForHistory(item);

  const scores = item?.editData?.scores || {};
  if(!roundsForItem.length || !teams.length) return '<div class="small">История игр недоступна.</div>';

  return roundsForItem.map((round,r)=>{
    const lines = round.map((m,i)=>{
      const a = scores[`a-${r}-${i}`] ?? '-';
      const b = scores[`b-${r}-${i}`] ?? '-';
      return `<div class="small">${escapeHtml(historySideLabel(teams, m[0]))} ${escapeHtml(a)}:${escapeHtml(b)} ${escapeHtml(historySideLabel(teams, m[1]))}</div>`;
    }).join('');
    return `<div style="margin:10px 0 4px;font-weight:700">Раунд ${r+1}</div>${lines}`;
  }).join('');
}

function stripPlayerBadge(name){
  // Удаляет медали (🥇 🥈 🥉) из начала строки и нормализует
  try {
    const str = String(name || '').trim();
    if(!str) return '';
    return str.replace(/^[🥇🥈🥉]\s*/, '').trim().replace(/\s+/g,' ');
  } catch(e){
    console.warn('stripPlayerBadge error:', e);
    return String(name || '').trim().replace(/\s+/g,' ');
  }
}

function normalizePlayerName(name){
  try {
    return stripPlayerBadge(name);
  } catch(e){
    console.warn('normalizePlayerName error:', e);
    return String(name || '').trim().replace(/\s+/g,' ');
  }
}

function getTeams(){
  try {
    const formatTeam = (a,b, index)=>{
      const partA = stripPlayerBadge(a || '');
      const partB = stripPlayerBadge(b || '');
      const parts = [partA, partB].filter(Boolean);
      return parts.length > 0 ? parts.join(' · ') : `Пара ${index}`;
    };
    if(isIndividual()){
      // В индивидуальном "команда" — это отдельный игрок; список идёт подряд по полям.
      return Array.from({length: getPlayerCount()}, (_, i)=>{

        const side = i % 2 === 0 ? 'a' : 'b';
        return stripPlayerBadge(document.getElementById(`team${block}${side}`)?.value) || `Игрок ${i + 1}`;
      });
    }
    return Array.from({length: getPairCount()}, (_, i)=>{
      const idx = i + 1;
      return formatTeam(document.getElementById(`team${idx}a`)?.value, document.getElementById(`team${idx}b`)?.value, idx);

    console.error('getTeams error:', e);
    if(isIndividual()){
      return Array.from({length: getPlayerCount()}, (_, i) => `Игрок ${i+1}`);
    }
    return Array.from({length: getPairCount()}, (_, i) => `Пара ${i+1}`);

function normalizeDateForInput(value){
  if(!value) return '';
  const trimmed = String(value).trim();
  const ddmmyyyy = /^([0-3]?\d)\.([0-1]?\d)\.([0-9]{4})$/;
  const iso = /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/;
  if(iso.test(trimmed)) return trimmed;
  const match = trimmed.match(ddmmyyyy);
  if(match){
    const [, day, month, year] = match;
    return `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}`;
  }
  return trimmed;
}

function getCourtName(courtIndex){
  try {
    const courtCount = getCourtCount();
    if(courtIndex < 1 || courtIndex > courtCount) return '';
    
    const court = document.getElementById(`court${courtIndex}`);
    const value = court?.value || '';
    return value ? `Корт №${value}` : `Корт ${courtIndex}`;

let advanceTimer = null;

// Переходим к следующей игре, когда дописать цифру уже некуда.
function advanceToNextScore(input, limit){
  window.clearTimeout(advanceTimer);
  const raw = String(input.value || '');
  const value = parseInt(raw, 10);
  if(!Number.isFinite(value) || value < 0 || value > limit) return;

  const jump = ()=>{
    const list = primaryScoreInputs();
    const next = list[list.indexOf(input) + 1];
    if(next){
      next.focus();
      if(typeof next.select === 'function') next.select();
    } else {
      input.blur();
    }
  };

  const unambiguous = value * 10 > limit || raw.length >= String(limit).length;
  if(unambiguous) jump();
  else advanceTimer = window.setTimeout(jump, 900);   // 0, 1, 2... — ждём, вдруг допишет
}

function setupScoreTypingMode(){
  // Пока вводим счёт, нижний остров уезжает вниз и не закрывает карточку.
  const isScore = el => el && el.matches && el.matches('.score input');
  document.addEventListener('focusin', e=>{
    if(isScore(e.target)) document.body.classList.add('score-typing');
  });
  document.addEventListener('focusout', e=>{
    if(!isScore(e.target)) return;
    window.setTimeout(()=>{
      if(!isScore(document.activeElement)) document.body.classList.remove('score-typing');
    }, 60);
  });
}

function autoFill(r,i,side){
  const a = document.getElementById(`a-${r}-${i}`);
  const b = document.getElementById(`b-${r}-${i}`);

  const limit = getRoundLimit();
  const av = parseInt(a.value);
  const bv = parseInt(b.value);

  if(side === "a" && !isNaN(av) && av >= 0 && av <= limit) b.value = limit - av;
  if(side === "b" && !isNaN(bv) && bv >= 0 && bv <= limit) a.value = limit - bv;

  saveData();
  if(side === "a") advanceToNextScore(a, limit);
}

function autoFillPlayoff(side,id){
  const a = document.getElementById(`playoff-a-${id}`);

function computeGroupStats(){
  const teams = getTeams();
  const stats = {};

  teams.forEach(t=>{
    stats[t] = {
      scored:0,
      conceded:0,
      delta:0,
      wins:0,
      draws:0,
      losses:0,
      rounds:Array(rounds.length).fill(null).map(()=>({scored:'', outcome:''}))
    };
  });

  rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      const aInput = document.getElementById(`a-${r}-${i}`);
      const bInput = document.getElementById(`b-${r}-${i}`);
      if(!aInput || !bInput || aInput.value === "" || bInput.value === "") return;

      const a = Number(aInput.value);
      const b = Number(bInput.value);

      // Парный формат: сторона матча — одна пара. Индивидуальный: двое игроков,
      // каждому засчитывается счёт его временной команды.
      const applyResult = (name, scored, conceded)=>{
        const s = stats[name];
        if(!s) return;
        s.scored += scored;
        s.conceded += conceded;
        s.rounds[r].scored = scored;
        if(scored > conceded){ s.wins++; s.rounds[r].outcome = 'П'; }
        else if(scored < conceded){ s.losses++; s.rounds[r].outcome = 'Пр'; }
        else { s.draws++; s.rounds[r].outcome = 'Н'; }
      };

      getMatchSideMembers(m[0]).forEach(name => applyResult(name, a, b));
      getMatchSideMembers(m[1]).forEach(name => applyResult(name, b, a));
    });
  });

  Object.keys(stats).forEach(t=>stats[t].delta = stats[t].scored - stats[t].conceded);

  const sorted = Object.entries(stats).sort((a,b)=>compareStandings(a[1], b[1]));

  return {teams, stats, sorted};
}

function getPlayoffMatchScore(id){

function getPlayoffMatchTeams(id){
  const pairCount = getPairCount();

  if(pairCount === 4){
    if(id === 'sf1') return [roundsStats[0], roundsStats[3]];
    if(id === 'sf2') return [roundsStats[1], roundsStats[2]];
    const finalData = getPlayoffFinalists();
    if(!finalData) return [];
    if(id === 'final') return [finalData.sf1Winner, finalData.sf2Winner];
    if(id === '3rd') return [finalData.sf1Loser, finalData.sf2Loser];
    return [];
  }

  if(pairCount === 6){
    if(id === 'q1') return [roundsStats[0], roundsStats[5]];
    if(id === 'q2') return [roundsStats[1], roundsStats[4]];
    if(id === 'q3') return [roundsStats[2], roundsStats[3]];
    const finalData = getPlayoffFinalists();
    if(!finalData) return [];
    if(id === 'w12') return [finalData.q1Winner, finalData.q2Winner];
    if(id === 'w13') return [finalData.q1Winner, finalData.q3Winner];
    if(id === 'w23') return [finalData.q2Winner, finalData.q3Winner];
    if(id === 'l12') return [finalData.q1Loser, finalData.q2Loser];
    if(id === 'l13') return [finalData.q1Loser, finalData.q3Loser];
    if(id === 'l23') return [finalData.q2Loser, finalData.q3Loser];
    return [];
  }

  return [];
}

function getPlayoffWinnerLoser(id){
  const teams = getPlayoffMatchTeams(id);
  const score = getPlayoffMatchScore(id);
  if(!teams.length || !score) return null;
  const winner = score.a >= score.b ? teams[0] : teams[1];
  const loser = winner === teams[0] ? teams[1] : teams[0];
  return {winner, loser, score, teams};
}

function rankPlayoffMiniGroup(teams, matchIds){
  const stats = {};
  teams.forEach(team=>{
    stats[team] = {team, scored:0, conceded:0, delta:0, wins:0};
  });

  matchIds.forEach(id=>{
    const matchTeams = getPlayoffMatchTeams(id);
    const score = getPlayoffMatchScore(id);
    if(matchTeams.length !== 2 || !score) return;

    const [A,B] = matchTeams;
    stats[A].scored += score.a;
    stats[A].conceded += score.b;
    stats[B].scored += score.b;
    stats[B].conceded += score.a;

    if(score.a > score.b) stats[A].wins++;
    if(score.b > score.a) stats[B].wins++;
  });

  Object.keys(stats).forEach(team=>{
    stats[team].delta = stats[team].scored - stats[team].conceded;
  });

  return Object.values(stats).sort((a,b)=>{
    if(b.delta !== a.delta) return b.delta - a.delta;
    if(b.scored !== a.scored) return b.scored - a.scored;
    if(b.wins !== a.wins) return b.wins - a.wins;
    return teams.indexOf(a.team) - teams.indexOf(b.team);
  }).map(item=>item.team);
}

function getPlayoffFinalists(){
  const pairCount = getPairCount();

  if(pairCount === 6){
    if(!roundsStats || roundsStats.length < 6) return null;
    const q1 = getPlayoffWinnerLoser('q1');
    const q2 = getPlayoffWinnerLoser('q2');
    const q3 = getPlayoffWinnerLoser('q3');
    if(!q1 || !q2 || !q3) return null;

    return {
      q1Winner:q1.winner,
      q1Loser:q1.loser,
      q2Winner:q2.winner,
      q2Loser:q2.loser,
      q3Winner:q3.winner,
      q3Loser:q3.loser,
      winners:[q1.winner, q2.winner, q3.winner],
      losers:[q1.loser, q2.loser, q3.loser]
    };
  }

  if(!roundsStats || roundsStats.length < 4) return null;
  const sf1a = document.getElementById('playoff-a-sf1');
  const sf1b = document.getElementById('playoff-b-sf1');
  const sf2a = document.getElementById('playoff-a-sf2');
  const sf2b = document.getElementById('playoff-b-sf2');
  if(!sf1a || !sf1b || !sf2a || !sf2b) return null;
  if(sf1a.value === "" || sf1b.value === "" || sf2a.value === "" || sf2b.value === "") return null;

  const place1 = roundsStats[0];
  const place2 = roundsStats[1];
  const place3 = roundsStats[2];
  const place4 = roundsStats[3];

  const sf1Winner = Number(sf1a.value) > Number(sf1b.value) ? place1 : place4;
  const sf1Loser = sf1Winner === place1 ? place4 : place1;
  const sf2Winner = Number(sf2a.value) > Number(sf2b.value) ? place2 : place3;
  const sf2Loser = sf2Winner === place2 ? place3 : place2;

  return {sf1Winner, sf1Loser, sf2Winner, sf2Loser};
}

          <input type="number" id="playoff-a-${m.id}" placeholder="0" min="0" max="${limit}" oninput="autoFillPlayoff('a','${m.id}')">
          <input type="number" id="playoff-b-${m.id}" placeholder="0" min="0" max="${limit}" oninput="autoFillPlayoff('b','${m.id}')">
        </div>
      </div>
    `;

    container.innerHTML = `
      <h3 style="text-align:center;margin-top:16px;">Финальный раунд за 1–3 места</h3>
      ${finalRound.map(renderMatch).join('')}
      <h3 style="text-align:center;margin-top:16px;">Раунд за 4–6 места</h3>
      ${lowerRound.map(renderMatch).join('')}
    `;

    loadPlayoffScores();
    playoffStarted = true;
    saveData();
    return;
  }

  container.innerHTML = `
  <h3 style="text-align:center;margin-top:16px;">Финал</h3>
  <div class="match">
    <div class="court">Финал · ${getCourtName(1)}</div>
    <div class="teams">${finalData.sf1Winner} vs ${finalData.sf2Winner}</div>
    <div class="score">
      <input type="number" id="playoff-a-final" placeholder="0" min="0" max="${limit}" oninput="autoFillPlayoff('a','final')">
      <input type="number" id="playoff-b-final" placeholder="0" min="0" max="${limit}" oninput="autoFillPlayoff('b','final')">
    </div>
  </div>
  <h3 style="text-align:center;margin-top:8px;">Матч за 3 место</h3>
  <div class="match">
    <div class="court">За 3 место · ${getCourtName(Math.min(2, getCourtCount()))}</div>
    <div class="teams">${finalData.sf1Loser} vs ${finalData.sf2Loser}</div>
    <div class="score">
      <input type="number" id="playoff-a-3rd" placeholder="0" min="0" max="${limit}" oninput="autoFillPlayoff('a','3rd')">
      <input type="number" id="playoff-b-3rd" placeholder="0" min="0" max="${limit}" oninput="autoFillPlayoff('b','3rd')">
    </div>
  </div>`;

  loadPlayoffScores();
  playoffStarted = true;
  saveData();
}

function playoffsCompleted(){
  const pairCount = getPairCount();
  const ids = pairCount === 6
    ? ['q1','q2','q3','w12','w13','w23','l12','l13','l23']
    : ['sf1','sf2','final','3rd'];

  return ids.every(id=>{
    const a = document.getElementById(`playoff-a-${id}`);
    const b = document.getElementById(`playoff-b-${id}`);
    return a && b && a.value !== "" && b.value !== "";
  });
}

function getFinalPlaces(){
  const pairCount = getPairCount();
  const finalData = getPlayoffFinalists();
  if(!finalData) return [];

  if(pairCount === 6){
    if(!playoffsCompleted()) return [];
    const topThree = rankPlayoffMiniGroup(finalData.winners, ['w12','w13','w23']);
    const bottomThree = rankPlayoffMiniGroup(finalData.losers, ['l12','l13','l23']);
    return [...topThree, ...bottomThree];
  }

  const fa = document.getElementById('playoff-a-final');
  const fb = document.getElementById('playoff-b-final');
  const ta = document.getElementById('playoff-a-3rd');
  const tb = document.getElementById('playoff-b-3rd');
  if(!fa || !fb || !ta || !tb || fa.value === "" || fb.value === "" || ta.value === "" || tb.value === "") return [];

  const finalWinner = Number(fa.value) > Number(fb.value) ? finalData.sf1Winner : finalData.sf2Winner;
  const finalLoser = finalWinner === finalData.sf1Winner ? finalData.sf2Winner : finalData.sf1Winner;
  const thirdWinner = Number(ta.value) > Number(tb.value) ? finalData.sf1Loser : finalData.sf2Loser;
  const fourth = thirdWinner === finalData.sf1Loser ? finalData.sf2Loser : finalData.sf1Loser;

  return [finalWinner, finalLoser, thirdWinner, fourth];
}

function getPlayoffStats(){
  const finalPlaces = getFinalPlaces();
  const pairCount = getPairCount();
  const stats = {};
  
  finalPlaces.forEach(team => {
    stats[team] = { team, scored: 0, conceded: 0, delta: 0, wins: 0, losses: 0, draws: 0 };
  });

  if(pairCount === 6){
    const playoffIds = ['q1','q2','q3','w12','w13','w23','l12','l13','l23'];
    playoffIds.forEach(id => {
      const teams = getPlayoffMatchTeams(id);
      const score = getPlayoffMatchScore(id);
      if(teams.length === 2 && score){
        const [a, b] = teams;
        if(stats[a]) {
          stats[a].scored += score.a;
          stats[a].conceded += score.b;
          if(score.a > score.b) stats[a].wins++;
          else if(score.a < score.b) stats[a].losses++;
          else stats[a].draws++;
        }
        if(stats[b]) {
          stats[b].scored += score.b;
          stats[b].conceded += score.a;
          if(score.b > score.a) stats[b].wins++;
          else if(score.b < score.a) stats[b].losses++;
          else stats[b].draws++;
        }
      }
    });
  } else {
    const playoffIds = ['sf1','sf2','final','3rd'];
    playoffIds.forEach(id => {
      const teams = getPlayoffMatchTeams(id);
      const score = getPlayoffMatchScore(id);
      if(teams.length === 2 && score){
        const [a, b] = teams;
        if(stats[a]) {
          stats[a].scored += score.a;
          stats[a].conceded += score.b;
          if(score.a > score.b) stats[a].wins++;
          else if(score.a < score.b) stats[a].losses++;
          else stats[a].draws++;
        }
        if(stats[b]) {
          stats[b].scored += score.b;
          stats[b].conceded += score.a;
          if(score.b > score.a) stats[b].wins++;
          else if(score.b < score.a) stats[b].losses++;
          else stats[b].draws++;
        }
      }
    });
  }

  Object.keys(stats).forEach(team => {
    stats[team].delta = stats[team].scored - stats[team].conceded;
  });

  return stats;
}

function tryRenderTournamentTable(){
  if(!playoffsCompleted()) return;
  const container = document.getElementById('tournament-table');
  if(!container) return;

  const finalPlaces = getFinalPlaces();
  const playoffStats = getPlayoffStats();
  let html = `<h2 style="text-align:center;margin-top:18px;">Итоги плей-офф</h2>`;
  html += `<div class="tourney-container"><div class="tourney-scroll"><table class="tourney-table"><thead><tr>`;
  html += `<th>Место</th><th>Пара</th><th>В-П-Н</th><th>Очки</th><th>Разница</th>`;
  html += `</tr></thead><tbody>`;

  finalPlaces.forEach((team,index) => {
    const s = playoffStats[team];
    if(!s) return;
    html += `<tr>`;
    html += `<td style="font-weight:700">${index+1}</td>`;
    html += `<td style="text-align:left;padding-left:12px"><strong>${team}</strong></td>`;
    html += `<td>${s.wins}-${s.losses}-${s.draws}</td>`;
    html += `<td>${s.scored}-${s.conceded}</td>`;
    html += `<td><span class="delta-value ${deltaClass(s.delta)}">${s.delta>0?'+':''}${s.delta}</span></td>`;
    html += `</tr>`;
  });

  html += `</tbody></table></div></div>`;

  container.innerHTML = html;
  showPostResultButtons();
  lastResultsText = buildDayText();
  saveData();
}

function getPlayoffScoreForTeam(team,type){
  if(!roundsStats || roundsStats.length < 4) return '-';

  const pairCount = getPairCount();

  if(pairCount === 6){
    const firstIds = ['q1','q2','q3'];
    const finalIds = ['w12','w13','w23','l12','l13','l23'];
    const ids = type === 'semi' ? firstIds : finalIds;
    const parts = [];

    ids.forEach(id=>{
      const teams = getPlayoffMatchTeams(id);
      const score = getPlayoffMatchScore(id);
      if(teams.length === 2 && score && (team === teams[0] || team === teams[1])){
        parts.push(team === teams[0] ? `${score.a}-${score.b}` : `${score.b}-${score.a}`);
      }
    });

    return parts.length ? parts.join(', ') : '-';
  }

  const finalData = getPlayoffFinalists();
  const sf1a = document.getElementById('playoff-a-sf1');
  const sf1b = document.getElementById('playoff-b-sf1');
  const sf2a = document.getElementById('playoff-a-sf2');
  const sf2b = document.getElementById('playoff-b-sf2');
  const fa = document.getElementById('playoff-a-final');
  const fb = document.getElementById('playoff-b-final');
  const ta = document.getElementById('playoff-a-3rd');
  const tb = document.getElementById('playoff-b-3rd');

  if(type === 'semi'){
    if(team === roundsStats[0] || team === roundsStats[3]) return `${sf1a?.value || ''}-${sf1b?.value || ''}`;
    if(team === roundsStats[1] || team === roundsStats[2]) return `${sf2a?.value || ''}-${sf2b?.value || ''}`;
    return '-';
  }

  if(!finalData) return '-';
  if(team === finalData.sf1Winner || team === finalData.sf2Winner) return `${fa?.value || ''}-${fb?.value || ''}`;
  if(team === finalData.sf1Loser || team === finalData.sf2Loser) return `${ta?.value || ''}-${tb?.value || ''}`;
  return '-';
}

    if(saved){
      return JSON.parse(saved);
    }
  } catch(e) {
    console.warn('getRawDraft error:', e);
  }
  try {
    const legacy = localStorage.getItem(LEGACY_DRAFT_KEY);
    if(legacy){
      return { snapshot: JSON.parse(legacy), activeTab: 'tournament', savedAt: new Date().toISOString(), legacy: true };
    }
  } catch(e){
    console.warn('getRawDraft legacy error:', e);
  }
  return null;
}

function restoreDraft(draft){
  const snapshot = draft?.snapshot;
  if(!snapshot) return;

  // Возвращаем идентичность турнира ДО первого автосейва, иначе он заведет дубль в истории.
  editingTournamentId = snapshot.tournamentId || null;

  const fieldMap = {
    tournamentName: snapshot.name || '',
    tournamentDate: snapshot.date || '',
    court1: snapshot.court1 || '',
    court2: snapshot.court2 || '',
    court3: snapshot.court3 || '',
    team1a: snapshot.team1a || '',
    team1b: snapshot.team1b || '',
    team2a: snapshot.team2a || '',
    team2b: snapshot.team2b || '',
    team3a: snapshot.team3a || '',
    team3b: snapshot.team3b || '',
    team4a: snapshot.team4a || '',
    team4b: snapshot.team4b || '',
    team5a: snapshot.team5a || '',
    team5b: snapshot.team5b || '',
    team6a: snapshot.team6a || '',
    team6b: snapshot.team6b || ''
  };

  Object.entries(fieldMap).forEach(([id,value])=>{
    const el = document.getElementById(id);
    if(el) el.value = value;
  });

  // Формат восстанавливаем первым: от него зависят и поля, и расписание.
  const formatEl = document.getElementById('tournamentFormat');
  if(formatEl) formatEl.value = snapshot.format === 'individual' ? 'individual' : 'pairs';
  const rankingEl = document.getElementById('rankingMode');
  if(rankingEl) rankingEl.value = RANKING_MODES.includes(snapshot.rankingMode) ? snapshot.rankingMode : 'delta';
  const playerCountEl = document.getElementById('playerCount');
  if(playerCountEl) playerCountEl.value = snapshot.playerCount ? String(snapshot.playerCount) : '';
  const individualCircleCountEl = document.getElementById('individualCircleCount');
  if(individualCircleCountEl) individualCircleCountEl.value = snapshot.individualCircleCount ? String(snapshot.individualCircleCount) : '';

  const pairCountEl = document.getElementById('pairCount');
  if(pairCountEl) pairCountEl.value = String(snapshot.pairCount || DEFAULT_PAIR_COUNT);
  const courtCountEl = document.getElementById('courtCount');
  if(courtCountEl) courtCountEl.value = String(snapshot.courtCount || DEFAULT_COURT_COUNT);
  const roundCountEl = document.getElementById('roundCount');
  if(roundCountEl) roundCountEl.value = String(snapshot.roundCount || 2);

  const roundLimitEl = document.getElementById('roundLimit');
  const roundLimitCustomEl = document.getElementById('roundLimitCustom');
  if(roundLimitEl){
    if(snapshot.roundLimitMode && snapshot.roundLimitMode === 'custom'){
      roundLimitEl.value = 'custom';
    } else if(snapshot.roundLimitMode && ROUND_LIMIT_OPTIONS.includes(Number(snapshot.roundLimitMode))){
      roundLimitEl.value = String(snapshot.roundLimitMode);
    } else if(ROUND_LIMIT_OPTIONS.includes(Number(snapshot.roundLimit))){
      roundLimitEl.value = String(snapshot.roundLimit);
    } else {
      roundLimitEl.value = 'custom';
    }
  }
  if(roundLimitCustomEl){
    roundLimitCustomEl.value = snapshot.roundLimitMode === 'custom' ? String(snapshot.roundLimitCustom || snapshot.roundLimit || DEFAULT_ROUND_LIMIT) : String(snapshot.roundLimit || DEFAULT_ROUND_LIMIT);
    roundLimitCustomEl.style.display = roundLimitEl?.value === 'custom' ? 'block' : 'none';
  }

  updateFormatFields();
  updateCourtOptionsForFormat();
  updatePairInputs();
  updateCourtFields();
  onRoundLimitChange();
  refreshRounds();

  setTournamentStarted(Boolean(snapshot.tournamentStarted));
  playoffStarted = Boolean(snapshot.playoffStarted);

  if(tournamentStarted){
    generateMatches();

    if(snapshot.scores){
      Object.entries(snapshot.scores).forEach(([id,value])=>{
        const el = document.getElementById(id);
        if(el) el.value = value || '';
      });
    }

    if(allGroupRoundsFilled()){
      calculateResults();
    }

    const hasPlayoffData = Object.keys(snapshot.scores || {}).some(key => key.startsWith('playoff-') && snapshot.scores[key] !== '');
    if(hasPlayoffData || snapshot.playoffStarted){
      playoffStarted = true;
      setPlayoffLimitFromSnapshot(snapshot);
      const playoffRendered = Boolean(
        document.getElementById('playoff-a-sf1') || document.getElementById('playoff-a-q1')
      );
      if(!playoffRendered) startPlayoff();
      setPlayoffLimitFromSnapshot(snapshot);
      applyPlayoffScoresFromSnapshot(snapshot);
      tryRenderFinals();
      applyPlayoffScoresFromSnapshot(snapshot);
      if(playoffsCompleted()) tryRenderTournamentTable();
      saveData();
    }
  } else {
    const matches = document.getElementById('matches');
    const results = document.getElementById('results');
    if(matches) matches.innerHTML = '';
    if(results) results.innerHTML = '';
    hidePostResultButtons();
  }

  if(draft.activeTab){
    switchTab(draft.activeTab);
  }

  updateDraftStatus();
  updateStartTournamentState();
  updateCalculateResultsState();
}

function removeDraft(){
  localStorage.removeItem(DRAFT_KEY);
  localStorage.removeItem(LEGACY_DRAFT_KEY);

function hasDuplicatePlayers(){
  if(!isIndividual()) return false;
  const names = getTeams().map(name => normalizePlayerKey(name)).filter(Boolean);
  if(names.length !== getPlayerCount()) return false;
  return new Set(names).size !== names.length;
}

function playersAreFilled(){
  const count = getNameBlockCount();
  if(!count) return false;
  for(let idx=1; idx<=count; idx++){
    const a = document.getElementById(`team${idx}a`);
    const b = document.getElementById(`team${idx}b`);
    if(!a || !b || !stripPlayerBadge(a.value) || !stripPlayerBadge(b.value)){
      return false;
    }
  }
  return true;
}

function canStartTournament(){
  if(!getTournamentFormat()) return false;
  if(isIndividual()){
    return Boolean(getPlayerCount() && getIndividualCircleCount() && getRoundLimit()
      && getCourtCount() && playersAreFilled() && !hasDuplicatePlayers());
  }
  return Boolean(getPairCount() && getRoundCount() && getRoundLimit() && getCourtCount() && playersAreFilled());
}

function getStartStatusText(){
  if(!getTournamentFormat()) return 'Выберите формат турнира';
  if(isIndividual()){
    if(!getPlayerCount()) return 'Выберите количество игроков';
    if(!getIndividualCircleCount()) return 'Выберите количество кругов';
    if(!getRoundLimit()) return 'Выберите лимит очков';
    if(!getCourtCount()) return 'Выберите количество кортов';
    if(!playersAreFilled()) return 'Заполните всех игроков';
    if(hasDuplicatePlayers()) return 'Игроки не должны повторяться';
    return '';
  }
  if(!getPairCount()) return 'Выберите количество пар';
  if(!getRoundCount()) return 'Выберите количество кругов';
  if(!getRoundLimit()) return 'Выберите лимит очков';
  if(!getCourtCount()) return 'Выберите количество кортов';
  if(!playersAreFilled()) return 'Заполните всех игроков';
  return '';
}

function buildGroupStageText(){
  const data = computeGroupStats();
  const name = getTournamentNameValue();
  const date = getTournamentDateDisplay();
  let text = `${name}${date ? ' • ' + date : ''}\n\n`;
  text += "История игр\n\n";

  rounds.forEach((round,r)=>{
    text += `Раунд ${r+1}\n`;
    round.forEach((m,i)=>{
      const a = document.getElementById(`a-${r}-${i}`);
      const b = document.getElementById(`b-${r}-${i}`);
      text += `${getMatchSideLabel(m[0])} ${a?.value || '-'}:${b?.value || '-'} ${getMatchSideLabel(m[1])}\n`;
    });
    text += "\n";
  });

  text += isIndividual() ? `Итоги турнира\n\n` : `Итоги группового этапа\n\n`;
  data.sorted.forEach((item,index)=>{
    const s = item[1];
    const delta = s.delta > 0 ? `+${s.delta}` : `${s.delta}`;
    text += `${index+1}. ${getBadgedTeam(item[0])} — ${s.wins}-${s.losses}-${s.draws} • ${s.scored}-${s.conceded} • ${delta}\n`;
  });

  text += "\n";
  return text;
}

function buildDayText(){
  let text = buildGroupStageText();

  const pairCount = getPairCount();
  const finalData = getPlayoffFinalists();
  if(finalData){
    text += `Плей-офф\n\n`;

    if(pairCount === 6){
      const qIds = ['q1','q2','q3'];
      text += `Первый раунд\n`;
      qIds.forEach((id,index)=>{
        const teams = getPlayoffMatchTeams(id);
        const score = getPlayoffMatchScore(id);
        if(teams.length === 2 && score){
          text += `${index+1}. ${getBadgedTeam(teams[0])} ${score.a}:${score.b} ${getBadgedTeam(teams[1])}\n`;
        }
      });
      text += `\n`;

      const winnerIds = ['w12','w13','w23'];
      if(winnerIds.some(id=>getPlayoffMatchScore(id))){
        text += `Раунд за 1–3 места\n`;
        winnerIds.forEach((id,index)=>{
          const teams = getPlayoffMatchTeams(id);
          const score = getPlayoffMatchScore(id);
          if(teams.length === 2 && score){
            text += `${index+1}. ${getBadgedTeam(teams[0])} ${score.a}:${score.b} ${getBadgedTeam(teams[1])}\n`;
          }
        });
        text += `\n`;
      }

      const loserIds = ['l12','l13','l23'];
      if(loserIds.some(id=>getPlayoffMatchScore(id))){
        text += `Раунд за 4–6 места\n`;
        loserIds.forEach((id,index)=>{
          const teams = getPlayoffMatchTeams(id);
          const score = getPlayoffMatchScore(id);
          if(teams.length === 2 && score){
            text += `${index+1}. ${getBadgedTeam(teams[0])} ${score.a}:${score.b} ${getBadgedTeam(teams[1])}\n`;
          }
        });
        text += `\n`;
      }

      const finalPlaces = getFinalPlaces();
      if(finalPlaces.length === 6){
        text += `Итоги плей-офф\n\n`;
        const stats = getPlayoffStats();
        finalPlaces.forEach((place,index)=>{
          const s = stats[place] || { wins:0, losses:0, draws:0, scored:0, conceded:0, delta:0 };
          const delta = s.delta > 0 ? `+${s.delta}` : `${s.delta}`;
          text += `${index+1}. ${place} — ${s.wins}-${s.losses}-${s.draws} • ${s.scored}-${s.conceded} • ${delta}\n`;
        });
      }

      return text;
    }

    const sf1 = getPlayoffMatchScore('sf1');
    const sf2 = getPlayoffMatchScore('sf2');

    text += `Полуфинал 1\n${getBadgedTeam(roundsStats[0])} ${sf1?.a ?? '-'}:${sf1?.b ?? '-'} ${getBadgedTeam(roundsStats[3])}\n\n`;
    text += `Полуфинал 2\n${getBadgedTeam(roundsStats[1])} ${sf2?.a ?? '-'}:${sf2?.b ?? '-'} ${getBadgedTeam(roundsStats[2])}\n\n`;

    const third = getPlayoffMatchScore('3rd');
    if(third){
      text += `Матч за 3 место\n${getBadgedPlayer(finalData.sf1Loser)} ${third.a}:${third.b} ${getBadgedPlayer(finalData.sf2Loser)}\n\n`;
    }

    const final = getPlayoffMatchScore('final');
    if(final){
      text += `Финал\n${getBadgedPlayer(finalData.sf1Winner)} ${final.a}:${final.b} ${getBadgedPlayer(finalData.sf2Winner)}\n\n`;
    }

    const finalPlaces = getFinalPlaces();
    if(finalPlaces.length === 4){
      const stats = getPlayoffStats();
      text += `Итоги плей-офф\n\n`;
      finalPlaces.forEach((place,index)=>{
        const s = stats[place] || { wins:0, losses:0, draws:0, scored:0, conceded:0, delta:0 };
        const delta = s.delta > 0 ? `+${s.delta}` : `${s.delta}`;
        text += `${index+1}. ${place} — ${s.wins}-${s.losses}-${s.draws} • ${s.scored}-${s.conceded} • ${delta}\n`;
      });
    }
  }

  return text;
}

function getPersonalStats(){
  const playerStats = {};
  function ensure(name){
    if(!playerStats[name]) playerStats[name] = {name, scored:0, conceded:0, delta:0, wins:0, losses:0, draws:0};
    return playerStats[name];
  }

  function addMatchResult(players, scored, conceded){
    players.forEach(p=>{
      const s = ensure(p);
      s.scored += scored;
      s.conceded += conceded;
      if(scored > conceded) s.wins++;
      else if(scored < conceded) s.losses++;
      else s.draws++;
    });
  }

  rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      const aEl = document.getElementById(`a-${r}-${i}`);
      const bEl = document.getElementById(`b-${r}-${i}`);
      if(!aEl || !bEl || aEl.value === "" || bEl.value === "") return;
      const a = Number(aEl.value);
      const b = Number(bEl.value);

      addMatchResult(getMatchSidePlayers(m[0]), a, b);
      addMatchResult(getMatchSidePlayers(m[1]), b, a);
    });
  });

  const playoffMatchIds = getPairCount() === 4
    ? ['sf1','sf2','final','3rd']
    : getPairCount() === 6
      ? ['q1','q2','q3','w12','w13','w23','l12','l13','l23']
      : [];

  playoffMatchIds.forEach(id=>{
    const score = getPlayoffMatchScore(id);
    if(!score) return;
    const teams = getPlayoffMatchTeams(id);
    if(teams.length !== 2) return;

    addMatchResult(getPlayersByTeamName(teams[0]), score.a, score.b);
    addMatchResult(getPlayersByTeamName(teams[1]), score.b, score.a);
  });

  Object.values(playerStats).forEach(s=>s.delta = s.scored - s.conceded);
  return Object.values(playerStats).sort((a,b)=>{
    if(b.delta !== a.delta) return b.delta - a.delta;
    if(b.scored !== a.scored) return b.scored - a.scored;
    return b.wins - a.wins;
  });
}

function upsertTournamentProgressToHistory(status='in_progress'){
  if(!canAutoSaveTournamentProgress()) return null;

  if(!editingTournamentId){
    editingTournamentId = String(Date.now());
  }

  const entry = buildTournamentHistoryEntry(status);
  entry.id = editingTournamentId;

  let saved = getLocalHistory();
  const index = saved.findIndex(item => String(item.id) === String(entry.id));
  if(index >= 0){
    saved[index] = {...saved[index], ...entry};
  } else {
    saved.push(entry);
  }

  localStorage.setItem(HISTORY_KEY, JSON.stringify(saved));
  currentHistory = [entry, ...currentHistory.filter(item => String(item.id) !== String(entry.id))];
  updateHomeScreenContinueButton();
  return entry;
}

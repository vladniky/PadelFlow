function editHistoryTournament(id){
  const item = findHistoryItem(id);
  if(!item || !item.editData){
    alert('Для этого турнира редактирование недоступно: нет сохраненных исходных данных.');
    return;
  }

  // Защита от потери активного турнира: черновик один, и он будет перезаписан.
  const currentDraft = getRawDraft();
  const draftIsLive = Boolean(currentDraft?.snapshot?.tournamentStarted);
  const sameTournament = String(editingTournamentId || '') === String(item.id);
  if(draftIsLive && !sameTournament){
    if(!confirm('Сейчас идет незавершенный турнир. Он уже сохранен в истории, но текущий черновик будет заменен турниром из истории. Продолжить?')) return;
  }

  const data = item.editData;
  editingTournamentId = item.id;

  const snapshot = {
    ...item,
    ...data
  };

  const tournamentNameValue = snapshot.name || snapshot.tournamentName || 'Американо';
  const tournamentDateValue = normalizeDateForInput(snapshot.date || snapshot.tournamentDate || '');
  const pairCountValue = snapshot.pairCount || item.pairCount || DEFAULT_PAIR_COUNT;
  const courtCountValue = snapshot.courtCount || item.courtCount || DEFAULT_COURT_COUNT;
  const roundLimitValue = snapshot.roundLimit || item.roundLimit || DEFAULT_ROUND_LIMIT;
  const roundLimitMode = ROUND_LIMIT_OPTIONS.includes(Number(roundLimitValue)) ? String(roundLimitValue) : 'custom';
  const roundLimitCustomValue = roundLimitMode === 'custom' ? String(roundLimitValue) : '';

  const nameEl = document.getElementById('tournamentName');
  if(nameEl) nameEl.value = tournamentNameValue;
  const dateEl = document.getElementById('tournamentDate');
  if(dateEl) dateEl.value = tournamentDateValue;

  ['roundCount','court1','court2','court3','team1a','team1b','team2a','team2b','team3a','team3b','team4a','team4b','team5a','team5b','team6a','team6b'].forEach(fieldId=>{
    const el = document.getElementById(fieldId);
    if(el && snapshot[fieldId] !== undefined) el.value = snapshot[fieldId] || '';
  });

  const formatEl = document.getElementById('tournamentFormat');
  if(formatEl) formatEl.value = getHistoryFormat(item);
  const rankingEl = document.getElementById('rankingMode');
  if(rankingEl) rankingEl.value = RANKING_MODES.includes(snapshot.rankingMode) ? snapshot.rankingMode : 'delta';
  const playerCountEl = document.getElementById('playerCount');
  if(playerCountEl) playerCountEl.value = snapshot.playerCount ? String(snapshot.playerCount) : '';
  const individualCircleCountEl = document.getElementById('individualCircleCount');
  if(individualCircleCountEl){
    individualCircleCountEl.value = String(snapshot.individualCircleCount || '');
  }
  const pairCountEl = document.getElementById('pairCount');
  if(pairCountEl) pairCountEl.value = String(pairCountValue);
  const courtCountEl = document.getElementById('courtCount');
  if(courtCountEl) courtCountEl.value = String(courtCountValue);
  const roundLimitEl = document.getElementById('roundLimit');
  if(roundLimitEl) roundLimitEl.value = roundLimitMode;
  const roundLimitCustomEl = document.getElementById('roundLimitCustom');
  if(roundLimitCustomEl) roundLimitCustomEl.value = roundLimitCustomValue || String(roundLimitValue);

  switchTab('tournament');
  updateFormatFields();
  updateCourtOptionsForFormat();
  updatePairInputs();
  updateCourtFields();
  onRoundLimitChange();
  setPlayoffLimitFromSnapshot(snapshot);
  refreshRounds();
  generateMatches();

  if(snapshot.scores){
    Object.keys(snapshot.scores).forEach(scoreId=>{
      const el = document.getElementById(scoreId);
      if(el) el.value = snapshot.scores[scoreId] || '';
    });
  }

  const shouldRestorePlayoff = snapshot.playoffStarted || (snapshot.scores && Object.keys(snapshot.scores).some(key => key.startsWith('playoff-') && snapshot.scores[key] !== ''));
  if(shouldRestorePlayoff){
    startPlayoff();
    if(snapshot.scores){
      Object.keys(snapshot.scores).forEach(scoreId=>{
        const el = document.getElementById(scoreId);
        if(el) el.value = snapshot.scores[scoreId] || '';
      });
    }
    tryRenderFinals();
    if(snapshot.scores){
      Object.keys(snapshot.scores).forEach(scoreId=>{
        const el = document.getElementById(scoreId);
        if(el) el.value = snapshot.scores[scoreId] || '';
      });
    }
    tryRenderTournamentTable();
  }

  saveData();
  loadScores();
  updateHeader('tournament');
  alert('Турнир загружен для редактирования. После изменений нажмите «Сохранить турнир».');
}

  const finalPlacesForEntry = playoffPlaces.length ? playoffPlaces : groupData.sorted.map(item=>item[0]);
  return {
    id: editingTournamentId || String(Date.now()),
    name: getTournamentNameValue(),
    date: getTournamentDateDisplay(),
    format: getTournamentFormat() || 'pairs',
    rankingMode: getRankingMode(),
    playerCount: getPlayerCount(),
    pairCount: getPairCount(),
    courtCount: getCourtCount(),
    roundLimit: getRoundLimit(),
    roundCount: getEffectiveRoundCount(),
    savedAt: new Date().toISOString(),
    status: status,
    teams: getTeams(),
    editData: getCurrentTournamentSnapshot(),
    groupText: buildGroupStageText(),
    dayText: buildDayText(),
    groupStandings: groupData.sorted.map((item,index)=>( {
      place: index+1,
      team: item[0],
      ...item[1]
    })),
    finalPlaces: finalPlacesForEntry,
    playerStats: getPersonalStats()
  };
}

async function saveTournament(){
  finalizingTournament = true;
  window.clearTimeout(autoHistorySaveTimer);
  const entry = buildTournamentHistoryEntry();
  let saved = getLocalHistory();

  // Не плодим дубли: сначала ищем по id турнира, потом по совпадению снимка данных.
  let updated = false;
  const existingIndexById = saved.findIndex(item => String(item.id) === String(entry.id));
  if(existingIndexById >= 0){
    saved[existingIndexById] = entry;
    updated = true;
  }

  if(!updated){
    const currentKey = JSON.stringify(entry.editData || {});
    for(let i=0;i<saved.length;i++){
      try {
        const itemKey = JSON.stringify(saved[i].editData || {});
        if(itemKey === currentKey){
          entry.id = saved[i].id || entry.id;
          saved[i] = entry;
          updated = true;
          break;
        }
      } catch(e){/* ignore */}
    }
  }

  if(!updated){
    if(editingTournamentId){
      saved = saved.filter(item => item.id !== editingTournamentId);
    }
    saved.push(entry);
  }

  localStorage.setItem(HISTORY_KEY, JSON.stringify(saved));
  currentHistory = [entry, ...currentHistory.filter(item => item.id !== entry.id)];
  removeDraft();

  const savedId = entry.id;
  editingTournamentId = null;
  startFreshTournament();
  finalizingTournament = false;

  // Сразу показываем сохранённый турнир — раскрытым, без лишних подтверждений.
  openedHistoryId = savedId;
  switchTab('history');
  window.scrollTo({ top: 0, behavior: 'auto' });
}


async function initApp(){
  // Clean up old/obsolete localStorage entries
  cleanupOldLocalStorage();
  
  refreshRounds();
  await loadTournamentHistory();
  loadDraftPrompt();
  updateFormatFields();
  setupScoreTypingMode();
  hidePostResultButtons();
  updateStartTournamentState();
  updateCalculateResultsState();

  const saveDraftNow = document.getElementById('saveDraftNowBtn');
  if(saveDraftNow){
    saveDraftNow.addEventListener('click', ()=>{
      saveData();
      updateDraftStatus();
      // minimal feedback
      alert('Черновик сохранён локально');
    });
  }


  // Телефон блокируется или приложение уходит в фон — фиксируем состояние немедленно.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'hidden'){
      try {
        saveData();
        if(canAutoSaveTournamentProgress()){
          upsertTournamentProgressToHistory('in_progress');
          pushProgressToCloud();
        }
      } catch(e){
        console.warn('visibilitychange save error:', e);
      }
    }
  });

  window.addEventListener('pagehide', ()=>{
    try { saveData(); } catch(e){ console.warn('pagehide save error:', e); }
  });

}

function registerServiceWorker(){
  if(!('serviceWorker' in navigator)) return;
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW register failed', e));
  });
}

registerServiceWorker();
initApp();
</script>

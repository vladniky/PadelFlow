<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PadelFlow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;padding:16px;background:#111;color:white;font-family:Arial,sans-serif}
input,select{width:100%;box-sizing:border-box;padding:14px;margin:6px 0;border:none;border-radius:12px;font-size:18px}
button{width:100%;padding:16px;margin:12px 0;border:none;border-radius:14px;background:#b7ff2a;color:#071006;font-size:18px;font-weight:700}
.secondary{background:#b7ff2a;color:#071006}
.danger{background:#ef4444!important;color:#111!important}
.app-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px}
.header-title{font-size:42px;font-weight:bold;line-height:1.1;margin:0;max-width:calc(100% - 88px)}
.header-logo{width:64px;height:64px;border-radius:14px;object-fit:cover;flex-shrink:0;display:block}
label{display:block;margin-top:10px;color:#aaa;font-size:14px}
.top-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px;align-items:start}
.top-grid .form-item:nth-child(1),
.top-grid .form-item:nth-child(2),
.top-grid .form-item:nth-child(3){grid-column:span 2}
.top-grid .form-item:nth-child(4),
.top-grid .form-item:nth-child(5){grid-column:span 3}
.top-grid input,
.top-grid select{padding:12px!important;margin:4px 0!important;font-size:16px!important;height:48px}
.top-grid label{font-size:13px}
.form-item label{margin:0 0 8px}
.teams-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:12px}
.team label{margin:0 0 8px}
.team-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match,.result-card{background:#1f1f1f;padding:16px;border-radius:16px;margin-bottom:16px}
.court{color:#999;margin-bottom:10px;text-transform:uppercase;font-size:13px}
.teams{font-size:18px;font-weight:bold;margin-bottom:14px}
.score{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{color:#aaa;font-size:15px}
.delta-value{font-weight:700}
.delta-pos{color:#b7ff2a}
.delta-neg{color:#ef4444}
.delta-zero{color:#ccc}
.tourney-container{background:#1a1a1a;padding:12px;border-radius:12px;margin-bottom:16px}
.tourney-scroll{overflow:auto}
.tourney-table{width:100%;border-collapse:collapse;min-width:900px}
.tourney-table th,.tourney-table td{padding:8px 10px;border-bottom:1px solid #2a2a2a;text-align:center}
.tourney-table th{font-weight:700;color:#ddd;font-size:14px}
.cell-result{display:flex;flex-direction:column;align-items:center}
.cell-result .points{font-weight:700;font-size:16px}
.cell-result .outcome{font-size:13px;margin-top:4px}
.outcome-win{color:#22c55e}
.outcome-draw{color:#9ca3af}
.outcome-loss{color:#ef4444}
.button-row{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.button-row button{flex:1;min-width:200px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;z-index:20;background:#111;padding:8px 0}
.tab-button{flex:1;min-width:120px;padding:12px 16px;border-radius:14px;border:none;background:#222;color:white;font-size:16px;font-weight:700;cursor:pointer}
.tab-button.active{background:#b7ff2a;color:#071006;box-shadow:0 0 0 1px rgba(183,255,42,.75),0 0 18px rgba(183,255,42,.25)}
.tab-content{display:none}
.tab-content.active{display:block}
.history-card{background:#1f1f1f;border:1px solid #2a2a2a;border-radius:16px;padding:18px;margin-bottom:14px;cursor:pointer;transition:background .2s,border .2s}
.history-card:hover{background:#272727}
.history-card-open{border-color:#b7ff2a;box-shadow:0 0 0 1px rgba(183,255,42,.45)}
.history-card-title{font-size:20px;font-weight:700;margin-bottom:8px}
.history-card-meta{color:#aaa;font-size:14px;margin-bottom:10px}
.history-detail{background:#1f1f1f;border-radius:16px;padding:18px;margin-top:16px}
.player-badges{display:none}
.player-badge{font-size:14px;color:#ddd;display:inline-flex;align-items:center;gap:4px;background:#161616;padding:4px 8px;border-radius:999px;border:1px solid #2a2a2a}
.rating-table{width:100%;border-collapse:collapse;margin-top:12px}
.rating-table th,.rating-table td{padding:10px 12px;border-bottom:1px solid #2a2a2a;text-align:left}
.rating-table th{color:#ddd;font-weight:700;font-size:14px}
.rating-controls{display:grid;grid-template-columns:minmax(180px,260px) 1fr;gap:12px;align-items:end;margin-bottom:12px}
.rating-controls label{margin:0 0 8px}
@media (max-width:700px){.rating-controls{grid-template-columns:1fr}}
.autocomplete-menu{position:fixed;z-index:9999;background:#181818;border:1px solid #3a3a3a;border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.45);overflow:hidden;max-height:260px;overflow-y:auto;display:none}
.autocomplete-item{padding:12px 14px;cursor:pointer;font-size:16px;border-bottom:1px solid #252525}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover,.autocomplete-item.active{background:#263315;color:#dfff30}
.autocomplete-empty{padding:12px 14px;color:#888;font-size:14px}
input:focus{outline:2px solid rgba(183,255,42,.7);box-shadow:0 0 0 4px rgba(183,255,42,.12)}
@media (min-width:701px) and (max-width:980px){
  .top-grid{grid-template-columns:repeat(2,1fr)}
  .top-grid .form-item:nth-child(n){grid-column:auto}
}
@media (max-width:700px){
  body{padding:12px}
  .app-header{align-items:center;margin-bottom:18px}
  .header-title{font-size:34px;max-width:calc(100% - 112px)}
  .header-logo{width:48px;height:48px}
  .top-grid{grid-template-columns:1fr}
  .top-grid .form-item:nth-child(n){grid-column:auto}
  .teams-grid,.team-inputs{grid-template-columns:1fr}
  .score{gap:8px}
  input{font-size:16px}
  button{font-size:16px}
}
</style>

<body>

      <input id="team2b" value="" placeholder="Игрок 2" list="playersList" oninput="saveData(); renderTeamInputBadges()">

  <div class="team">

      <input id="team3b" value="" placeholder="Игрок 2" list="playersList" oninput="saveData(); renderTeamInputBadges()">

<div id="post-results-buttons" class="button-row" style="display:none;">
  <button class="secondary" onclick="shareResults()">Поделиться результатом</button>

<script>
// Supabase инициализация
const SUPABASE_URL = 'https://lnrkhhiusfkwigxmichp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_C5yjnR5cd0W3I_GbeHKxeA_DBCj-KRn';
let supabaseClient = null;
if(window.supabase && typeof window.supabase.createClient === 'function'){
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

const HISTORY_KEY = 'padelFlowTournamentHistory';
let currentHistory = [];
let openedHistoryId = null;

const roundTemplates = [
  [[0,3,1],[1,2,2]],
  [[0,1,1],[2,3,2]],
  [[0,2,1],[1,3,2]],
  [[3,0,1],[2,1,2]],
  [[1,0,1],[3,2,2]],
  [[2,0,1],[3,1,2]]
];

let rounds = [];

function getRoundCount(){
  const el = document.getElementById('roundCount');
  const value = parseInt(el?.value || '2', 10);
  return [1,2,3].includes(value) ? value : 2;
}

function buildRoundsByCount(count){
  if(count === 1) return roundTemplates.slice(0,3);
  if(count === 3) return roundTemplates.concat(roundTemplates.slice(0,3));
  return roundTemplates.slice(0,6);
}

function refreshRounds(){
  rounds = buildRoundsByCount(getRoundCount());
  return rounds;
}

let lastResultsText = "";
let editingTournamentId = null;
let editingCloudId = null;
let roundsStats = [];
let lastStats = null;
const defaultPlayers = [
  'Владимиров Никита',
  'Жаткин Александр',
  'Vitaliy M',
  'Курятников Константин',
  'Михаил Авагян',
  'Сотников Александр',
  'Боев Сергей',
  'Гейер Станислав',
  'Шагинуров Олег',
  'Алена А'
];

function getCurrentDate(){
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

function formatDateForDisplay(value){
  const raw = String(value || '').trim();
  if(!raw) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){
    const [yyyy, mm, dd] = raw.split('-');
    return `${dd}.${mm}.${yyyy}`;
  }
  return raw;
}

function getTournamentNameValue(){
  const value = document.getElementById('tournamentName')?.value?.trim();
  return value || 'Командный Американо';
}

function getTournamentDateValue(){
  return document.getElementById('tournamentDate')?.value || '';
}

function getTournamentDateDisplay(){
  return formatDateForDisplay(getTournamentDateValue());
}

function updateHeader(tab='tournament'){
  const header = document.getElementById('appHeader');
  if(!header) return;
  if(tab === 'history'){
    header.textContent = 'История турниров';
    return;
  }
  if(tab === 'rating'){
    header.textContent = 'Рейтинг игроков';
    return;
  }
  const name = getTournamentNameValue();
  const date = getTournamentDateDisplay();
  header.textContent = date ? `${name} • ${date}` : name;
}

function switchTab(tab){
  document.querySelectorAll('.tab-button').forEach(btn=>btn.classList.toggle('active', btn.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(content=>{
    const show = content.id === `tab-${tab}`;
    content.classList.toggle('active', show);
    content.style.display = show ? 'block' : 'none';
  });
  updateHeader(tab);
  if(tab === 'history') renderHistory();
  if(tab === 'rating') renderRating();
}

function getLocalHistory(){
  try {
    const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(saved) ? saved : [];
  } catch(e){
    return [];
  }
}

function getHistoryDataSync(){
  const local = getLocalHistory();
  return currentHistory && currentHistory.length ? currentHistory : local;
}

function findHistoryItem(id){
  return getHistoryDataSync().find(item => item.id === id);
}

async function loadTournamentHistory(){
  const localHistory = getLocalHistory();
  if(!supabaseClient){
    currentHistory = localHistory;
    return localHistory;
  }

  try {
    const { data, error } = await supabaseClient.from('tournaments').select('id, created_at, name, date, data').order('created_at', { ascending: false });
    if(error) throw error;

    const cloudHistory = Array.isArray(data) ? data.map(row => {
      const item = row.data || {};
      if(!item.id) item.id = String(row.id || Date.now());
      return {
        ...item,
        _cloudId: row.id,
        name: row.name || item.name || '',
        date: row.date || item.date || '',
        savedAt: item.savedAt || new Date(row.created_at).toISOString()
      };
    }) : [];

    const knownIds = new Set(cloudHistory.map(item => String(item.id)));
    const merged = [...cloudHistory];
    localHistory.forEach(item => {
      if(item.id && !knownIds.has(String(item.id))) merged.unshift(item);
    });
    currentHistory = merged;
    return merged;
  } catch(err){
    currentHistory = localHistory;
    return localHistory;
  }
}

async function saveTournamentToCloud(tournament, cloudId = null){
  if(!supabaseClient){
    return { ok: false, error: 'Supabase unavailable' };
  }
  try {
    let response;
    if(cloudId){
      response = await supabaseClient
        .from('tournaments')
        .update({ name: tournament.name, date: tournament.date, data: tournament })
        .eq('id', cloudId);
    } else {
      response = await supabaseClient
        .from('tournaments')
        .insert([{ name: tournament.name, date: tournament.date, data: tournament }]);
    }
    const { error } = response;
    return error ? { ok: false, error } : { ok: true };
  } catch(err){
    return { ok: false, error: err };
  }
}

async function syncLocalToCloud(){
  const localHistory = getLocalHistory();
  if(!supabaseClient || !navigator.onLine || !localHistory.length){
    return { synced: 0 };
  }

  try {
    const { data, error } = await supabaseClient.from('tournaments').select('data');
    if(error) throw error;
    const remoteIds = new Set((Array.isArray(data) ? data : []).map(row => String(row.data?.id)).filter(Boolean));
    const toSync = localHistory.filter(item => item.id && !remoteIds.has(String(item.id)));
    if(!toSync.length) return { synced: 0 };
    const inserts = toSync.map(item => ({ name: item.name, date: item.date, data: item }));
    const { error: insertError } = await supabaseClient.from('tournaments').insert(inserts);
    if(insertError) throw insertError;
    return { synced: inserts.length };
  } catch(err){
    console.warn('syncLocalToCloud error', err);
    return { synced: 0, error: err };
  }
}

function getRatingStats(){
  const saved = getHistoryDataSync();
  const stats = {};
  saved.forEach(tournament=>{
    const players = tournament.playerStats || [];
    const seen = new Set();
    players.forEach(p=>{
      if(!stats[p.name]) stats[p.name] = {name:p.name, tournaments:0, scored:0, conceded:0, delta:0, wins:0, losses:0, draws:0};
      if(!seen.has(p.name)){
        stats[p.name].tournaments++;
        seen.add(p.name);
      }
      stats[p.name].scored += p.scored;
      stats[p.name].conceded += p.conceded;
      stats[p.name].delta += p.delta;
      stats[p.name].wins += p.wins;
      stats[p.name].losses += p.losses;
      stats[p.name].draws += p.draws;
    });
  });
  const list = Object.values(stats).sort((a,b)=>{
    if(b.delta !== a.delta) return b.delta - a.delta;
    if(b.wins !== a.wins) return b.wins - a.wins;
    if(b.scored !== a.scored) return b.scored - a.scored;
    return a.name.localeCompare(b.name,'ru');
  });
  return list;
}

function buildPlayerMedalMap(){
  const sorted = getRatingStats();
  const medalMap = {};
  let rankGroup = 0;
  let prevKey = null;
  sorted.forEach((player,index)=>{
    const key = `${player.delta}|${player.wins}|${player.scored}|${player.losses}|${player.draws}`;
    if(key !== prevKey){
      rankGroup++;
      prevKey = key;
    }
    const medal = rankGroup === 1 ? '🥇' : rankGroup === 2 ? '🥈' : rankGroup === 3 ? '🥉' : '';
    medalMap[player.name] = medal;
  });
  return medalMap;
}

function getPlayerBadge(name){
  return '';
}

function getBadgedPlayer(name){
  const badge = getPlayerBadge(name);
  return badge ? `${badge} ${name}` : name;
}

function getBadgedTeam(team){
  return String(team || '').split(' · ').map(name => getBadgedPlayer(name)).join(' · ');
}

function renderTeamInputBadges(){
  [['team1a','team1b','team1badges'],['team2a','team2b','team2badges'],['team3a','team3b','team3badges'],['team4a','team4b','team4badges']].forEach(([a,b,target])=>{
    const nameA = normalizePlayerName(document.getElementById(a)?.value);
    const nameB = normalizePlayerName(document.getElementById(b)?.value);
    const badges = [nameA,nameB].filter(Boolean).map(name=>{
      const badge = getPlayerBadge(name);
      return badge ? `<span class="player-badge">${badge} ${name}</span>` : `<span class="player-badge">${name}</span>`;
    }).join('');
    const targetEl = document.getElementById(target);
    if(targetEl) targetEl.innerHTML = badges;
  });
}

function parseHistoryDateValue(value){
  const raw = String(value || '').trim();
  if(!raw) return 0;

  if(/^\d{4}-\d{2}-\d{2}/.test(raw)){
    const time = new Date(raw).getTime();
    return Number.isNaN(time) ? 0 : time;
  }

  const match = raw.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if(match){
    const time = new Date(`${match[3]}-${match[2]}-${match[1]}T00:00:00`).getTime();
    return Number.isNaN(time) ? 0 : time;
  }

  const fallback = new Date(raw).getTime();
  return Number.isNaN(fallback) ? 0 : fallback;
}

function getHistorySortTime(item){
  return parseHistoryDateValue(item?.date) || parseHistoryDateValue(item?.savedAt) || parseHistoryDateValue(item?._createdAt) || 0;
}

function sortHistoryOldToNew(list){
  return [...list].sort((a,b)=>{
    const timeA = getHistorySortTime(a);
    const timeB = getHistorySortTime(b);
    if(timeA !== timeB) return timeA - timeB;
    return String(a?.name || '').localeCompare(String(b?.name || ''), 'ru');
  });
}

async function renderHistory(){
  const saved = sortHistoryOldToNew(await loadTournamentHistory());
  const container = document.getElementById('historyContainer');
  const detail = document.getElementById('historyDetail');
  if(!container || !detail) return;
  if(!saved.length){
    openedHistoryId = null;
    container.innerHTML = `<div class="history-detail"><strong>Сохраненных турниров пока нет</strong></div>`;
    detail.innerHTML = '';
    return;
  }

  container.innerHTML = saved.map(item=>{
    const winner = item.finalPlaces?.[0] || '-';
    const second = item.finalPlaces?.[1] || '-';
    const third = item.finalPlaces?.[2] || '-';
    const isOpen = String(openedHistoryId) === String(item.id);
    return `
      <div class="history-card ${isOpen ? 'history-card-open' : ''}" onclick="toggleHistoryDetail('${item.id}')">
        <div class="history-card-title">${escapeHtml(item.name)}</div>
        <div class="history-card-meta">${escapeHtml(item.date)}</div>
        <div>Победитель: <strong>${escapeHtml(getBadgedPlayer(winner))}</strong></div>
        <div class="small">🥇 ${escapeHtml(getBadgedPlayer(winner))} · 🥈 ${escapeHtml(getBadgedPlayer(second))} · 🥉 ${escapeHtml(getBadgedPlayer(third))}</div>
      </div>
      ${isOpen ? buildHistoryDetailHtml(item) : ''}
    `;
  }).join('');

  detail.innerHTML = '';
}

function extractPlayoffBlock(dayText){
  const text = String(dayText || '');
  const start = text.indexOf('🏆 Плей-офф');
  if(start === -1) return '';
  return text.slice(start).trim();
}

function toggleHistoryDetail(id){
  openedHistoryId = String(openedHistoryId) === String(id) ? null : id;
  renderHistory();
}


function getRoundsForHistory(item){
  const raw = Number(item?.roundCount || item?.editData?.roundCount || 2);
  const count = [1,2,3].includes(raw) ? raw : 2;
  return buildRoundsByCount(count);
}

function getHistoryTeams(item){
  if(Array.isArray(item?.teams) && item.teams.length >= 4) return item.teams;
  const data = item?.editData || {};
  const formatTeam = (a,b)=>{

function getPlayerWinrateValue(player){
  const played = player.wins + player.losses + player.draws;
  return played ? player.wins / played : 0;
}

function sortRatingList(list, mode){
  const sorted = [...list];
  sorted.sort((a,b)=>{
    if(mode === 'record'){
      if(b.wins !== a.wins) return b.wins - a.wins;
      if(a.losses !== b.losses) return a.losses - b.losses;
      if(b.draws !== a.draws) return b.draws - a.draws;
      if(b.delta !== a.delta) return b.delta - a.delta;
      if(b.scored !== a.scored) return b.scored - a.scored;
      return a.name.localeCompare(b.name,'ru');
    }

    if(mode === 'winrate'){
      const br = getPlayerWinrateValue(b);
      const ar = getPlayerWinrateValue(a);
      if(br !== ar) return br - ar;
      if(b.wins !== a.wins) return b.wins - a.wins;
      if(b.tournaments !== a.tournaments) return b.tournaments - a.tournaments;
      if(b.delta !== a.delta) return b.delta - a.delta;
      return a.name.localeCompare(b.name,'ru');
    }

    // points: сортируем по набранным очкам, потом по разнице.
    if(b.scored !== a.scored) return b.scored - a.scored;
    if(b.delta !== a.delta) return b.delta - a.delta;
    if(b.wins !== a.wins) return b.wins - a.wins;
    return a.name.localeCompare(b.name,'ru');
  });
  return sorted;
}


async function renderRating(){
  await loadTournamentHistory();
  const saved = getHistoryDataSync();
  const container = document.getElementById('ratingContainer');
  if(!container) return;
  if(!saved.length){
    openedHistoryId = null;
    container.innerHTML = `<div class="history-detail"><strong>Рейтинг пока пуст</strong></div>`;
    return;
  }

  const stats = {};
  saved.forEach(tournament=>{
    const players = tournament.playerStats || [];
    const seen = new Set();
    players.forEach(p=>{
      if(!stats[p.name]) stats[p.name] = {name:p.name, tournaments:0, scored:0, conceded:0, delta:0, wins:0, losses:0, draws:0};
      if(!seen.has(p.name)){
        stats[p.name].tournaments++;
        seen.add(p.name);
      }
      stats[p.name].scored += p.scored;
      stats[p.name].conceded += p.conceded;
      stats[p.name].delta += p.delta;
      stats[p.name].wins += p.wins;
      stats[p.name].losses += p.losses;
      stats[p.name].draws += p.draws;
    });
  });

  const mode = getRatingSortMode();
  const list = sortRatingList(Object.values(stats), mode);

  const rows = list.map(p=>{
    const played = p.wins + p.losses + p.draws;
    const rate = played ? Math.round((p.wins/played)*100) : 0;
    const badge = getPlayerBadge(p.name);
    return `<tr><td>${badge ? badge + ' ' : ''}${escapeHtml(p.name)}</td><td>${p.tournaments}</td><td>${p.scored}-${p.conceded}</td><td>${p.delta>0?'+':''}${p.delta}</td><td>${p.wins}-${p.losses}-${p.draws}</td><td>${rate}%</td></tr>`;
  }).join('');

  container.innerHTML = `
    <div class="rating-controls">
      <div>
        <label>Считать рейтинг по</label>
        <select id="ratingSortMode" onchange="setRatingSortMode(this.value)">
          <option value="points" ${mode === 'points' ? 'selected' : ''}>Количеству очков</option>
          <option value="record" ${mode === 'record' ? 'selected' : ''}>В-П-Н</option>
          <option value="winrate" ${mode === 'winrate' ? 'selected' : ''}>Проценту побед</option>
        </select>
      </div>
    </div>
    <div class="tourney-container">
      <div class="tourney-scroll">
        <table class="rating-table">
          <thead>
            <tr><th>Игрок</th><th>Турниры</th><th>Очки</th><th>Разница</th><th>В-П-Н</th><th>Процент побед</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <div class="button-row">
      <button class="secondary" onclick="copyRatingText()">Копировать рейтинг</button>
      <button class="secondary" onclick="shareRatingText()">Поделиться рейтингом</button>
    </div>`;
}

function stripPlayerBadge(name){
  // Удаляет медали (🥇 🥈 🥉) из начала строки и нормализует
  try {
    const str = String(name || '').trim();
    if(!str) return '';
    return str.replace(/^[🥇🥈🥉]\s*/, '').trim().replace(/\s+/g,' ');
  } catch(e){
    console.warn('stripPlayerBadge error:', e);
    return String(name || '').trim().replace(/\s+/g,' ');
  }
}

function normalizePlayerName(name){
  try {
    return stripPlayerBadge(name);
  } catch(e){
    console.warn('normalizePlayerName error:', e);
    return String(name || '').trim().replace(/\s+/g,' ');
  }
}

      const partA = stripPlayerBadge(a || '');

      return parts.length > 0 ? parts.join(' · ') : 'Команда';
    };

    ];

    .replaceAll('&','&amp;')

function getAllPlayers(){
  let players = [];
  try { players = JSON.parse(localStorage.getItem('playersList') || '[]'); } catch(e){ players = []; }
  if(!Array.isArray(players)) players = [];
  players = players.concat(defaultPlayers);

  getHistoryDataSync().forEach(tournament=>{
    (tournament.playerStats || []).forEach(p=>{
      if(p && p.name) players.push(p.name);
    });
    (tournament.teams || []).forEach(team=>{
      String(team || '').split(' · ').forEach(name=>players.push(name));
    });
  });

  const clean = [];
  players.forEach(p=>{
    const name = normalizePlayerName(p);
    if(name && !clean.some(x=>x.toLowerCase()===name.toLowerCase())) clean.push(name);
  });
  clean.sort((a,b)=>a.localeCompare(b,'ru'));
  return clean;
}

  const av = parseInt(a.value);

  if(side === "b" && !isNaN(bv) && bv >= 0 && bv <= 32) a.value = 32 - bv;

  saveData();
}

function computeGroupStats(){
  const teams = getTeams();
  const stats = {};

  teams.forEach(t=>{
    stats[t] = {
      scored:0,
      conceded:0,
      delta:0,
      wins:0,
      draws:0,
      losses:0,
      rounds:Array(rounds.length).fill(null).map(()=>({scored:'', outcome:''}))
    };
  });

  rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      const aInput = document.getElementById(`a-${r}-${i}`);
      const bInput = document.getElementById(`b-${r}-${i}`);
      if(!aInput || !bInput || aInput.value === "" || bInput.value === "") return;

      const a = Number(aInput.value);
      const b = Number(bInput.value);
      const A = teams[m[0]];
      const B = teams[m[1]];

      stats[A].scored += a;
      stats[A].conceded += b;
      stats[B].scored += b;
      stats[B].conceded += a;

      stats[A].rounds[r].scored = a;
      stats[B].rounds[r].scored = b;

      if(a > b){
        stats[A].wins++;
        stats[B].losses++;
        stats[A].rounds[r].outcome = 'П';
        stats[B].rounds[r].outcome = 'Пр';
      } else if(a < b){
        stats[B].wins++;
        stats[A].losses++;
        stats[B].rounds[r].outcome = 'П';
        stats[A].rounds[r].outcome = 'Пр';
      } else {
        stats[A].draws++;
        stats[B].draws++;
        stats[A].rounds[r].outcome = 'Н';
        stats[B].rounds[r].outcome = 'Н';
      }
    });
  });

  Object.keys(stats).forEach(t=>stats[t].delta = stats[t].scored - stats[t].conceded);

  const sorted = Object.entries(stats).sort((a,b)=>{
    if(b[1].delta !== a[1].delta) return b[1].delta - a[1].delta;
    if(b[1].scored !== a[1].scored) return b[1].scored - a[1].scored;
    return b[1].wins - a[1].wins;
  });

  return {teams, stats, sorted};
}

function startPlayoff(){
  if(!roundsStats || roundsStats.length < 4){
    calculateResults();
  }
  const groupButtons = document.getElementById('group-action-buttons');
  if(groupButtons) groupButtons.style.display = 'none';
  const section = document.getElementById('playoff-section');
  if(section){
    section.innerHTML = showPlayoff();
  } else {
    const results = document.getElementById('results');
    if(results && !document.getElementById('playoff-finals')){
      results.insertAdjacentHTML('beforeend', showPlayoff());
    }
  }
  loadPlayoffScores();
  tryRenderFinals();
  tryRenderTournamentTable();
  saveData();
}

function getPlayoffFinalists(){
  if(!roundsStats || roundsStats.length < 4) return null;
  const sf1a = document.getElementById('playoff-a-sf1');
  const sf1b = document.getElementById('playoff-b-sf1');
  const sf2a = document.getElementById('playoff-a-sf2');
  const sf2b = document.getElementById('playoff-b-sf2');
  if(!sf1a || !sf1b || !sf2a || !sf2b) return null;
  if(sf1a.value === "" || sf1b.value === "" || sf2a.value === "" || sf2b.value === "") return null;

  const place1 = roundsStats[0];
  const place2 = roundsStats[1];
  const place3 = roundsStats[2];
  const place4 = roundsStats[3];

  const sf1Winner = Number(sf1a.value) > Number(sf1b.value) ? place1 : place4;
  const sf1Loser = sf1Winner === place1 ? place4 : place1;
  const sf2Winner = Number(sf2a.value) > Number(sf2b.value) ? place2 : place3;
  const sf2Loser = sf2Winner === place2 ? place3 : place2;

  return {sf1Winner, sf1Loser, sf2Winner, sf2Loser};
}

function getFinalPlaces(){
  const finalData = getPlayoffFinalists();
  if(!finalData) return [];
  const fa = document.getElementById('playoff-a-final');
  const fb = document.getElementById('playoff-b-final');
  const ta = document.getElementById('playoff-a-3rd');
  const tb = document.getElementById('playoff-b-3rd');
  if(!fa || !fb || !ta || !tb || fa.value === "" || fb.value === "" || ta.value === "" || tb.value === "") return [];

  const finalWinner = Number(fa.value) > Number(fb.value) ? finalData.sf1Winner : finalData.sf2Winner;
  const finalLoser = finalWinner === finalData.sf1Winner ? finalData.sf2Winner : finalData.sf1Winner;
  const thirdWinner = Number(ta.value) > Number(tb.value) ? finalData.sf1Loser : finalData.sf2Loser;
  const fourth = thirdWinner === finalData.sf1Loser ? finalData.sf2Loser : finalData.sf1Loser;

  return [finalWinner, finalLoser, thirdWinner, fourth];
}

function getPlayoffScoreForTeam(team,type){
  if(!roundsStats || roundsStats.length < 4) return '-';
  const finalData = getPlayoffFinalists();
  const sf1a = document.getElementById('playoff-a-sf1');
  const sf1b = document.getElementById('playoff-b-sf1');
  const sf2a = document.getElementById('playoff-a-sf2');
  const sf2b = document.getElementById('playoff-b-sf2');
  const fa = document.getElementById('playoff-a-final');
  const fb = document.getElementById('playoff-b-final');
  const ta = document.getElementById('playoff-a-3rd');
  const tb = document.getElementById('playoff-b-3rd');

  if(type === 'semi'){
    if(team === roundsStats[0] || team === roundsStats[3]) return `${sf1a?.value || ''}-${sf1b?.value || ''}`;
    if(team === roundsStats[1] || team === roundsStats[2]) return `${sf2a?.value || ''}-${sf2b?.value || ''}`;
    return '-';
  }

  if(!finalData) return '-';
  if(team === finalData.sf1Winner || team === finalData.sf2Winner) return `${fa?.value || ''}-${fb?.value || ''}`;
  if(team === finalData.sf1Loser || team === finalData.sf2Loser) return `${ta?.value || ''}-${tb?.value || ''}`;
  return '-';
}

function getPersonalStats(){
  const playerStats = {};
  function ensure(name){
    if(!playerStats[name]) playerStats[name] = {name, scored:0, conceded:0, delta:0, wins:0, losses:0, draws:0};
    return playerStats[name];
  }

  rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      const aEl = document.getElementById(`a-${r}-${i}`);
      const bEl = document.getElementById(`b-${r}-${i}`);
      if(!aEl || !bEl || aEl.value === "" || bEl.value === "") return;
      const a = Number(aEl.value);
      const b = Number(bEl.value);

      const playersA = getPlayersByIndex(m[0]);
      const playersB = getPlayersByIndex(m[1]);

      playersA.forEach(p=>{
        const s = ensure(p);
        s.scored += a; s.conceded += b;
        if(a > b) s.wins++; else if(a < b) s.losses++; else s.draws++;
      });
      playersB.forEach(p=>{
        const s = ensure(p);
        s.scored += b; s.conceded += a;
        if(b > a) s.wins++; else if(b < a) s.losses++; else s.draws++;
      });
    });
  });

  Object.values(playerStats).forEach(s=>s.delta = s.scored - s.conceded);
  return Object.values(playerStats).sort((a,b)=>{
    if(b.delta !== a.delta) return b.delta - a.delta;
    if(b.scored !== a.scored) return b.scored - a.scored;
    return b.wins - a.wins;
  });
}


function getCurrentTournamentSnapshot(){
  const scores = {};
  rounds.forEach((round,r)=>{
    round.forEach((m,i)=>{
      const a = document.getElementById(`a-${r}-${i}`);
      const b = document.getElementById(`b-${r}-${i}`);
      if(a) scores[`a-${r}-${i}`] = a.value;
      if(b) scores[`b-${r}-${i}`] = b.value;
    });
  });
  ["sf1","sf2","final","3rd"].forEach(stage=>{
    const a = document.getElementById(`playoff-a-${stage}`);
    const b = document.getElementById(`playoff-b-${stage}`);
    if(a) scores[`playoff-a-${stage}`] = a.value;
    if(b) scores[`playoff-b-${stage}`] = b.value;
  });
  return {
    name: document.getElementById('tournamentName')?.value || '',
    date: document.getElementById('tournamentDate')?.value || '',
    court1: document.getElementById('court1')?.value || '',
    court2: document.getElementById('court2')?.value || '',
    roundCount: document.getElementById('roundCount')?.value || '2',
    team1a: document.getElementById('team1a')?.value || '',
    team1b: document.getElementById('team1b')?.value || '',
    team2a: document.getElementById('team2a')?.value || '',
    team2b: document.getElementById('team2b')?.value || '',
    team3a: document.getElementById('team3a')?.value || '',
    team3b: document.getElementById('team3b')?.value || '',
    team4a: document.getElementById('team4a')?.value || '',
    team4b: document.getElementById('team4b')?.value || '',
    scores
  };
}

function editHistoryTournament(id){
  const item = findHistoryItem(id);
  if(!item || !item.editData){
    alert('Для этого турнира редактирование недоступно: нет сохраненных исходных данных.');
    return;
  }
  const data = item.editData;
  editingTournamentId = item.id;
  editingCloudId = item._cloudId || null;
  ['tournamentName','tournamentDate','roundCount','court1','court2','team1a','team1b','team2a','team2b','team3a','team3b','team4a','team4b'].forEach(id=>{
    const el = document.getElementById(id);
    if(el && data[id] !== undefined) el.value = data[id] || '';
  });
  switchTab('tournament');
  refreshRounds();
  generateMatches();
  if(data.scores){
    Object.keys(data.scores).forEach(scoreId=>{
      const el = document.getElementById(scoreId);
      if(el) el.value = data.scores[scoreId];
    });
  }
  calculateResults();
  const hasPlayoffScores = data.scores && Object.keys(data.scores).some(key => key.startsWith('playoff-') && data.scores[key] !== '');
  if(hasPlayoffScores){
    startPlayoff();
    Object.keys(data.scores).forEach(scoreId=>{
      const el = document.getElementById(scoreId);
      if(el) el.value = data.scores[scoreId];
    });
    tryRenderFinals();
    Object.keys(data.scores).forEach(scoreId=>{
      const el = document.getElementById(scoreId);
      if(el) el.value = data.scores[scoreId];
    });
    tryRenderTournamentTable();
  }
  updateHeader('tournament');
  alert('Турнир загружен для редактирования. После изменений нажмите «Сохранить турнир».');
}

function buildTournamentHistoryEntry(){
  const groupData = computeGroupStats();
  return {
    id: editingTournamentId || String(Date.now()),
    name:getTournamentNameValue(),
    date:getTournamentDateDisplay(),
    roundCount:getRoundCount(),
    savedAt:new Date().toISOString(),
    teams:getTeams(),
    editData:getCurrentTournamentSnapshot(),
    groupText:buildGroupStageText(),
    dayText:buildDayText(),
    groupStandings:groupData.sorted.map((item,index)=>({
      place:index+1,
      team:item[0],
      ...item[1]
    })),
    finalPlaces:getFinalPlaces(),
    playerStats:getPersonalStats()
  };
}

async function saveTournament(){
  savePlayersFromFields();
  const entry = buildTournamentHistoryEntry();
  let saved = getLocalHistory();

  if(editingTournamentId){
    saved = saved.filter(item => item.id !== editingTournamentId);
  }
  saved.push(entry);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(saved));
  currentHistory = [entry, ...currentHistory.filter(item => item.id !== entry.id)];

  const cloudResult = await saveTournamentToCloud(entry, editingCloudId);
  if(cloudResult.ok){
    alert(editingTournamentId ? 'Готово! Турнир обновлен в облаке' : 'Готово! Турнир сохранен в облако');
  } else {
    console.warn('Supabase save failed', cloudResult.error);
    alert('Готово! Турнир сохранен локально. Облачная синхронизация будет выполнена позднее.');
  }

  editingTournamentId = null;
  editingCloudId = null;
  renderHistory();
  renderRating();
}

function clearTournament(){
  if(confirm("Очистить турнир?")){
    localStorage.removeItem("padelAmericanoData");
    location.reload();
  }
}

initApp();
